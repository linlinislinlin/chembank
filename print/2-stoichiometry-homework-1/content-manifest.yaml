  text: 'Sodium peroxide, \ce{Na2O2}, is used to absorb carbon dioxide from the atmosphere
    and release oxygen in closed environments such as space capsules and submarines.

    \[\ce{2Na2O2 + 2CO2 -> 2Na2CO3 + O2}\]

    Which mass of sodium peroxide would be required to remove 2.4\,dm$^3$ of carbon
    dioxide from the atmosphere at room temperature and pressure?

    \optrow{2.4\,g}{3.9\,g}{7.8\,g}{15.6\,g}'
