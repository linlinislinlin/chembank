    - id: '15.1-2'
      text: classify halogenoalkanes into primary, secondary and tertiary
    - id: '15.1-3a'
      text: 'describe the following nucleophilic substitution reactions: (a) the reaction with NaOH(aq)
        and heat to produce an alcohol'
    - id: '15.1-3b'
      text: 'describe the following nucleophilic substitution reactions: (b) the reaction with KCN in
        ethanol and heat to produce a nitrile'
    - id: '15.1-3c'
      text: 'describe the following nucleophilic substitution reactions: (c) the reaction with NH3 in
