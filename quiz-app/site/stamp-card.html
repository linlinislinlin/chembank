<!DOCTYPE html>
<html lang="zh" data-course="as">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#FFB300" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<title>我的印章卡 · ChemBank</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="stylesheet" href="theme.css" />
<style>
  * { box-sizing: border-box; }
  body { font-family: 'Inter', -apple-system, 'PingFang SC', sans-serif; background: var(--bg); color: var(--text); margin: 0; min-height: 100vh; }
  .page { max-width: 560px; margin: 0 auto; padding: 26px 16px 60px; }

  h1 { font-size: 22px; font-weight: 900; margin: 0 0 2px; text-align: center; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 20px; text-align: center; }

  .login-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px 20px; box-shadow: var(--shadow); }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
  .input { width: 100%; padding: 11px 13px; border: 1px solid var(--line); border-radius: 10px; font-size: 15px; font-family: inherit; }
  .input:focus { outline: none; border-color: var(--accent); }
  .btn { width: 100%; border: none; border-radius: 10px; padding: 12px 16px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; background: var(--accent); color: #fff; }
  .btn:hover { background: var(--accent-deep); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .err { color: var(--red); font-size: 13px; margin-top: 8px; min-height: 18px; }

  /* 印章卡 */
  .card-panel { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 22px 20px; box-shadow: var(--shadow); text-align: center; }
  .big-num { font-size: 64px; font-weight: 900; line-height: 1; color: var(--amber); }
  .big-label { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .stamp-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 20px 0 6px; }
  .cell { aspect-ratio: 1; border-radius: 8px; display: grid; place-items: center; font-size: 20px; border: 1px solid var(--line); background: var(--bg-soft); }
  .cell.on { background: linear-gradient(180deg, #fff3c4, #ffd54f); border-color: #f0b400; box-shadow: 0 0 8px rgba(255,178,0,.35); }
  .cell.off { opacity: .35; }
  .hint-note { color: var(--muted); font-size: 12px; }

  /* 历史 */
  .hist { margin-top: 20px; }
  .hist h2 { font-size: 15px; margin: 0 0 10px; }
  .h-item { display: flex; align-items: center; gap: 10px; padding: 9px 2px; border-bottom: 1px solid var(--line-soft); font-size: 13.5px; }
  .h-delta { font-weight: 800; color: var(--green-deep); width: 34px; }
  .h-reason { flex: 1; }
  .h-note { color: var(--muted); font-size: 12px; }
  .h-time { color: var(--muted); font-size: 11px; }
  .empty { color: var(--muted); text-align: center; padding: 16px; }

  .who { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
  .logout { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 4px 12px; font-size: 12px; cursor: pointer; font-family: inherit; }
  .logout:hover { background: var(--bg-soft); }
  .back { display: block; margin: 22px auto 0; background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 12px; padding: 8px 16px; font-size: 13px; cursor: pointer; font-family: inherit; }
  .back:hover { background: var(--bg-soft); }
</style>
</head>
<body>
<div class="page">
  <div id="login">
    <h1>⭐ 我的印章卡</h1>
    <p class="sub">输入姓名和学号，查看你累计的章。</p>
    <div class="login-card">
      <div class="field"><label>姓名（英文，和作业一致）</label><input class="input" id="inName" placeholder="如 Monica Liu" /></div>
      <div class="field"><label>学号</label><input class="input" id="inNo" placeholder="如 T20280178" /></div>
      <button class="btn" id="goBtn">查看我的章</button>
      <div class="err" id="err"></div>
    </div>
  </div>

  <div id="view" style="display:none">
    <h1>⭐ 我的印章卡</h1>
    <p class="sub"><span class="who" id="whoBox"></span> <button class="logout" id="logout">切换账号</button></p>
    <div class="card-panel">
      <div class="big-num" id="totalNum">0</div>
      <div class="big-label">已累计的章</div>
      <div class="stamp-grid" id="grid"></div>
      <div class="hint-note">每满 4 个章排成一行</div>
    </div>
    <div class="hist">
      <h2>最近记录</h2>
      <div id="hist"></div>
    </div>
    <button class="back" onclick="history.length > 1 ? history.back() : location.href='home.html'">← 返回学生首页</button>
  </div>
</div>

<script src="config.js"></script>
<script src="supabase-client.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
function esc(s) { return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

const ID_KEY = "stamp-card-id";

function currentIdentity() {
  return { name: $("inName").value.trim(), student_no: $("inNo").value.trim() };
}

async function doView() {
  const id = currentIdentity();
  if (!id.name || !id.student_no) { $("err").textContent = "请输入姓名和学号"; return; }
  try { localStorage.setItem(ID_KEY, JSON.stringify(id)); } catch (_) {}
  const btn = $("goBtn"); btn.disabled = true; btn.textContent = "加载中…";
  $("err").textContent = "";
  try {
    const s = await window.StampLedgerDB.studentStatus(id);
    renderView(id, s);
    $("login").style.display = "none";
    $("view").style.display = "block";
  } catch (e) {
    $("err").textContent = e.message || "加载失败";
  } finally { btn.disabled = false; btn.textContent = "查看我的章"; }
}

function renderView(id, s) {
  const total = Number(s.total) || 0;
  $("whoBox").textContent = id.name + " · " + id.student_no;
  $("totalNum").textContent = total;

  // 印章格子：满行 4 个，最后一行不足补空
  const cells = [];
  const filled = Math.min(total, 200); // 显示上限 200，超出用数字表达
  const lastRowRem = filled % 4;
  const pad = lastRowRem === 0 ? 0 : 4 - lastRowRem;
  const shown = filled + pad;
  for (let i = 0; i < shown; i++) {
    cells.push(`<div class="cell ${i < filled ? "on" : "off"}">${i < filled ? "⭐" : "○"}</div>`);
  }
  if (shown === 0) cells.push('<div class="cell off" style="grid-column:span 4">○</div>');
  $("grid").innerHTML = cells.join("");

  const hist = s.history || [];
  const box = $("hist");
  if (!hist.length) { box.innerHTML = '<div class="empty">还没有章，上课多举手呀！</div>'; return; }
  box.innerHTML = hist.map((h) => `
    <div class="h-item">
      <span class="h-delta">${h.delta > 0 ? "+" + h.delta : h.delta}</span>
      <span class="h-reason">${esc(h.reason)}${h.note ? ' <span class="h-note">(' + esc(h.note) + ')</span>' : ""}</span>
      <span class="h-time">${new Date(h.created_at).toLocaleString("zh-CN", { hour12: false, month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" })}</span>
    </div>`).join("");
}

$("goBtn").onclick = doView;
$("inNo").addEventListener("keydown", (e) => { if (e.key === "Enter") doView(); });
$("logout").onclick = () => {
  try { localStorage.removeItem(ID_KEY); } catch (_) {}
  $("view").style.display = "none";
  $("login").style.display = "block";
};

(function init() {
  try {
    const saved = localStorage.getItem(ID_KEY);
    if (saved) {
      const id = JSON.parse(saved);
      $("inName").value = id.name || "";
      $("inNo").value = id.student_no || "";
    }
  } catch (_) {}
})();
</script>
</body>
</html>
