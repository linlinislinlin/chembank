meta:
  exam_board: CIE
  syllabus_code: '9701'
  level: AS/A Level
  title: Cambridge International AS & A Level Chemistry
  syllabus_years: '2025-2027'
  source_pdf: 9701_syllabus_2025-2027.pdf
  note: Codes follow syllabus Subject content numbering. AS Level = topics 1–22; A Level adds 23–37. Tag
    questions with the most specific subtopic code(s). Learning outcome ids use {subtopic}-{n} or {subtopic}-{n}{letter}
    (syllabus numbering under each subtopic). Tag questions with the most specific learning_outcomes ids
    and always keep parent syllabus_codes.
topics:
- code: '1'
  title: Atomic structure
  level: AS
  group: Physical chemistry
  subtopics:
  - code: '1.1'
    title: Particles in the atom and atomic radius
    learning_outcomes:
    - id: '1.1-1'
      text: understand that atoms are mostly empty space surrounding a very small, dense nucleus that
        contains protons and neutrons; electrons are found in shells in the empty space around the nucleus
    - id: '1.1-2'
      text: identify and describe protons, neutrons and electrons in terms of their relative charges and
        relative masses
    - id: '1.1-3'
      text: understand the terms atomic and proton number; mass and nucleon number
    - id: '1.1-4'
      text: describe the distribution of mass and charge within an atom
    - id: '1.1-5'
      text: describe the behaviour of beams of protons, neutrons and electrons moving at the same velocity
        in an electric field
    - id: '1.1-6'
      text: determine the numbers of protons, neutrons and electrons present in both atoms and ions given
        atomic or proton number, mass or nucleon number and charge
    - id: '1.1-7'
      text: state and explain qualitatively the variations in atomic radius and ionic radius across a
        period and down a group
  - code: '1.2'
    title: Isotopes
    learning_outcomes:
    - id: '1.2-1'
      text: define the term isotope in terms of numbers of protons and neutrons
    - id: '1.2-2'
      text: understand the notation x proton number
    - id: '1.2-3'
      text: state that and explain why isotopes of the same element have the same chemical properties
    - id: '1.2-4'
      text: state that and explain why isotopes of the same element have different physical properties,
        limited to mass and density
  - code: '1.3'
    title: Electrons, energy levels and atomic orbitals
    learning_outcomes:
    - id: '1.3-1'
      text: 'understand the terms: • shells, sub-shells and orbitals • principal quantum number (n) •
        ground state, limited to electronic configuration'
    - id: '1.3-2'
      text: describe the number of orbitals making up s, p and d sub-shells, and the number of electrons
        that can fill s, p and d sub-shells
    - id: '1.3-3'
      text: describe the order of increasing energy of the sub-shells within the first three shells and
        the 4s and 4p sub-shells
    - id: '1.3-4'
      text: describe the electronic configurations to include the number of electrons in each shell, sub-shell
        and orbital
    - id: '1.3-5'
      text: explain the electronic configurations in terms of energy of the electrons and inter-electron
        repulsion
    - id: '1.3-6'
      text: 'determine the electronic configuration of atoms and ions given the atomic or proton number
        and charge, using either of the following conventions: e.g. for Fe: 1s22s22p63s23p63d64s2 (full
        electronic configuration) or [Ar] 3d64s2 (shorthand electronic configuration)'
    - id: '1.3-7'
      text: 'understand and use the electrons in boxes notation e.g. for Fe: [Ar]'
    - id: '1.3-8'
      text: describe and sketch the shapes of s and p orbitals
    - id: '1.3-9'
      text: describe a free radical as a species with one or more unpaired electrons
  - code: '1.4'
    title: Ionisation energy
    learning_outcomes:
    - id: '1.4-1'
      text: define and use the term first ionisation energy, IE
    - id: '1.4-2'
      text: construct equations to represent first, second and subsequent ionisation energies
    - id: '1.4-3'
      text: identify and explain the trends in ionisation energies across a period and down a group of
        the Periodic Table
    - id: '1.4-4'
      text: identify and explain the variation in successive ionisation energies of an element
    - id: '1.4-5'
      text: understand that ionisation energies are due to the attraction between the nucleus and the
        outer electron
    - id: '1.4-6'
      text: explain the factors influencing the ionisation energies of elements in terms of nuclear charge,
        atomic/ionic radius, shielding by inner shells and sub-shells and spin-pair repulsion
    - id: '1.4-7'
      text: deduce the electronic configurations of elements using successive ionisation energy data
    - id: '1.4-8'
      text: deduce the position of an element in the Periodic Table using successive ionisation energy
        data
- code: '2'
  title: Atoms, molecules and stoichiometry
  level: AS
  group: Physical chemistry
  subtopics:
  - code: '2.1'
    title: Relative masses of atoms and molecules
    learning_outcomes:
    - id: '2.1-1'
      text: define the unified atomic mass unit as one twelfth of the mass of a carbon-12 atom
    - id: '2.1-2'
      text: define relative atomic mass, Ar, relative isotopic mass, relative molecular mass, Mr, and
        relative formula mass in terms of the unified atomic mass unit
  - code: '2.2'
    title: The mole and the Avogadro constant
    learning_outcomes:
    - id: '2.2-1'
      text: define and use the term mole in terms of the Avogadro constant
  - code: '2.3'
    title: Formulae
    learning_outcomes:
    - id: '2.3-1a'
      text: 'write formulas of ionic compounds from ionic charges and oxidation numbers (shown by a Roman
        numeral), including: (a) the prediction of ionic charge from the position of an element in the
        Periodic Table'
    - id: '2.3-1b'
      text: 'write formulas of ionic compounds from ionic charges and oxidation numbers (shown by a Roman
        numeral), including: (b) recall of the names and formulas for the following ions: NO3 HCO3 –,
        PO4 3–'
    - id: '2.3-2a'
      text: write and construct equations (which should be balanced), including ionic equations (which
        should not include spectator ions)
    - id: '2.3-2b'
      text: use appropriate state symbols in equations
    - id: '2.3-3'
      text: define and use the terms empirical and molecular formula
    - id: '2.3-4'
      text: understand and use the terms anhydrous, hydrated and water of crystallisation
    - id: '2.3-5'
      text: calculate empirical and molecular formulas, using given data
  - code: '2.4'
    title: Reacting masses and volumes (of solutions and gases)
    learning_outcomes:
    - id: '2.4-1a'
      text: 'perform calculations including use of the mole concept, involving: (a) reacting masses (from
        formulas and equations) including percentage yield calculations'
    - id: '2.4-1b'
      text: 'perform calculations including use of the mole concept, involving: (b) volumes of gases (e.g.
        in the burning of hydrocarbons)'
    - id: '2.4-1c'
      text: 'perform calculations including use of the mole concept, involving: (c) volumes and concentrations
        of solutions'
    - id: '2.4-1d'
      text: 'perform calculations including use of the mole concept, involving: (d) limiting reagent and
        excess reagent (When performing calculations, candidates’ answers should reflect the number of
        significant figures given or asked for in the question. When rounding up or down, candidates should
        ensure that significant figures are neither lost unnecessarily nor used beyond what is justified
        (see also Mathematical requirements section).)'
    - id: '2.4-1e'
      text: 'perform calculations including use of the mole concept, involving: (e) deduce stoichiometric
        relationships from calculations such as those in 2.4.1(a)–(d)'
- code: '3'
  title: Chemical bonding
  level: AS
  group: Physical chemistry
  subtopics:
  - code: '3.1'
    title: Electronegativity and bonding
    learning_outcomes:
    - id: '3.1-1'
      text: define electronegativity as the power of an atom to attract electrons to itself
    - id: '3.1-2'
      text: explain the factors influencing the electronegativities of the elements in terms of nuclear
        charge, atomic radius and shielding by inner shells and sub-shells
    - id: '3.1-3'
      text: state and explain the trends in electronegativity across a period and down a group of the
        Periodic Table
    - id: '3.1-4'
      text: use the differences in Pauling electronegativity values to predict the formation of ionic
        and covalent bonds (the presence of covalent character in some ionic compounds will not be assessed)
        (Pauling electronegativity values will be given where necessary)
  - code: '3.2'
    title: Ionic bonding
    learning_outcomes:
    - id: '3.2-1'
      text: define ionic bonding as the electrostatic attraction between oppositely charged ions (positively
        charged cations and negatively charged anions)
    - id: '3.2-2'
      text: describe ionic bonding including the examples of sodium chloride, magnesium oxide and calcium
        fluoride
  - code: '3.3'
    title: Metallic bonding
    learning_outcomes:
    - id: '3.3-1'
      text: define metallic bonding as the electrostatic attraction between positive metal ions and delocalised
        electrons
  - code: '3.4'
    title: Covalent bonding and coordinate (dative covalent) bonding
    learning_outcomes:
    - id: '3.4-1a'
      text: 'define covalent bonding as electrostatic attraction between the nuclei of two atoms and a
        shared pair of electrons (a) describe covalent bonding in molecules including: • hydrogen, H2
        • oxygen, O2 • nitrogen, N2 • chlorine, Cl 2 • hydrogen chloride, HCl • carbon dioxide, CO2 •
        ammonia, NH3 • methane, CH4 • ethane, C2H6 • ethene, C2H4'
    - id: '3.4-1b'
      text: define covalent bonding as electrostatic attraction between the nuclei of two atoms and a
        shared pair of electrons (b) understand that elements in period 3 can expand their octet including
        in the compounds sulfur dioxide, SO2, phosphorus pentachloride, PCl 5 , and sulfur hexafluoride,
        SF6
    - id: '3.4-1c'
      text: define covalent bonding as electrostatic attraction between the nuclei of two atoms and a
        shared pair of electrons (c) describe coordinate (dative covalent) bonding, including in the reaction
        between ammonia and hydrogen chloride gases to form the ammonium ion, NH4
    - id: '3.4-2a'
      text: 'describe covalent bonds in terms of orbital overlap giving σ and π bonds: • σ bonds are formed
        by direct overlap of orbitals between the bonding atoms • π bonds are formed by the sideways overlap
        of adjacent p orbitals above and below the σ bond'
    - id: '3.4-2b'
      text: describe how the σ and π bonds form in molecules including H₂, C₂H₆, C₂H₄, HCN and N₂
    - id: '3.4-2c'
      text: use the concept of hybridisation to describe sp, sp² and sp³ orbitals
    - id: '3.4-3a'
      text: 'define the terms: • bond energy as the energy required to break one mole of a particular
        covalent bond in the gaseous state • bond length as the internuclear distance of two covalently
        bonded atoms'
    - id: '3.4-3b'
      text: use bond energy values and the concept of bond length to compare the reactivity of covalent
        molecules
  - code: '3.5'
    title: Shapes of molecules
    learning_outcomes:
    - id: '3.5-1'
      text: 'state and explain the shapes of, and bond angles in, molecules by using VSEPR theory, including
        as simple examples: • BF3 (trigonal planar, 120°) • CO2 (linear, 180°) • CH4 (tetrahedral, 109.5°)
        • NH3 (pyramidal, 107°) • H2O (non-linear, 104.5°) • SF6 (octahedral, 90°) • PF5 (trigonal bipyramidal,
        120° and 90°)'
    - id: '3.5-2'
      text: predict the shapes of, and bond angles in, molecules and ions analogous to those specified
        in 3.5.1
  - code: '3.6'
    title: Intermolecular forces, electronegativity and bond properties
    learning_outcomes:
    - id: '3.6-1a'
      text: describe hydrogen bonding, limited to molecules containing N–H and O–H groups, including ammonia
        and water as simple examples
    - id: '3.6-1b'
      text: 'use the concept of hydrogen bonding to explain the anomalous properties of H₂O (ice and water):
        • its relatively high melting and boiling points • its relatively high surface tension • the density
        of the solid ice compared with the liquid water'
    - id: '3.6-2'
      text: use the concept of electronegativity to explain bond polarity and dipole moments of molecules
    - id: '3.6-3a'
      text: describe van der Waals’ forces as the intermolecular forces between molecular entities other
        than those due to bond formation, and use the term van der Waals’ forces as a generic term to
        describe all intermolecular forces
    - id: '3.6-3b'
      text: 'describe the types of van der Waals’ forces: • instantaneous dipole–induced dipole (id-id)
        forces, also called London dispersion forces • permanent dipole–permanent dipole (pd-pd) forces,
        including hydrogen bonding'
    - id: '3.6-3c'
      text: describe hydrogen bonding and understand that hydrogen bonding is a special case of permanent
        dipole–permanent dipole forces between molecules where hydrogen is bonded to a highly electronegative
        atom
    - id: '3.6-4'
      text: state that, in general, ionic, covalent and metallic bonding are stronger than intermolecular
        forces
  - code: '3.7'
    title: Dot-and-cross diagrams
    learning_outcomes:
    - id: '3.7-1'
      text: use dot-and-cross diagrams to illustrate ionic, covalent and coordinate bonding including
        the representation of any compounds stated in 3.4 and 3.5 (dot-and-cross diagrams may include
        species with atoms which have an expanded octet or species with an odd number of electrons)
- code: '4'
  title: States of matter
  level: AS
  group: Physical chemistry
  subtopics:
  - code: '4.1'
    title: 'The gaseous state: ideal and real gases and pV = nRT'
    learning_outcomes:
    - id: '4.1-1'
      text: explain the origin of pressure in a gas in terms of collisions between gas molecules and the
        wall of the container
    - id: '4.1-2'
      text: understand that ideal gases have zero particle volume and no intermolecular forces of attraction
    - id: '4.1-3'
      text: state and use the ideal gas equation pV = nRT in calculations, including in the determination
        of Mr
  - code: '4.2'
    title: Bonding and structure
    learning_outcomes:
    - id: '4.2-1a'
      text: 'describe, in simple terms, the lattice structure of a crystalline solid which is: (a) giant
        ionic, including sodium chloride and magnesium oxide'
    - id: '4.2-1b'
      text: 'describe, in simple terms, the lattice structure of a crystalline solid which is: (b) simple
        molecular, including iodine, buckminsterfullerene C60 and ice'
    - id: '4.2-1c'
      text: 'describe, in simple terms, the lattice structure of a crystalline solid which is: (c) giant
        molecular, including silicon(IV) oxide, graphite and diamond'
    - id: '4.2-1d'
      text: 'describe, in simple terms, the lattice structure of a crystalline solid which is: (d) giant
        metallic, including copper'
    - id: '4.2-2'
      text: describe, interpret and predict the effect of different types of structure and bonding on
        the physical properties of substances, including melting point, boiling point, electrical conductivity
        and solubility
    - id: '4.2-3'
      text: deduce the type of structure and bonding present in a substance from given information
- code: '5'
  title: Chemical energetics
  level: AS
  group: Physical chemistry
  subtopics:
  - code: '5.1'
    title: Enthalpy change, ΔH
    learning_outcomes:
    - id: '5.1-1'
      text: understand that chemical reactions are accompanied by enthalpy changes and these changes can
        be exothermic (ΔH is negative) or endothermic (ΔH is positive)
    - id: '5.1-2'
      text: construct and interpret a reaction pathway diagram, in terms of the enthalpy change of the
        reaction and of the activation energy
    - id: '5.1-3a'
      text: 'define and use the terms: (a) standard conditions (this syllabus assumes that these are 298
        K and 101 kPa) shown by'
    - id: '5.1-3b'
      text: 'define and use the terms: (b) enthalpy change with particular reference to: reaction, ΔHr
        , formation, ΔHf , combustion, ΔHc , neutralisation, ΔHneut'
    - id: '5.1-4'
      text: understand that energy transfers occur during chemical reactions because of the breaking and
        making of chemical bonds
    - id: '5.1-5'
      text: use bond energies (ΔH positive, i.e. bond breaking) to calculate enthalpy change of reaction,
        ΔHr
    - id: '5.1-6'
      text: understand that some bond energies are exact and some bond energies are averages
    - id: '5.1-7'
      text: calculate enthalpy changes from appropriate experimental results, including the use of the
        relationships q = mcΔT and ΔH = –mcΔT/n
  - code: '5.2'
    title: Hess’s law
    learning_outcomes:
    - id: '5.2-1'
      text: apply Hess’s law to construct simple energy cycles
    - id: '5.2-2a'
      text: 'carry out calculations using cycles and relevant energy terms, including: (a) determining
        enthalpy changes that cannot be found by direct experiment'
    - id: '5.2-2b'
      text: 'carry out calculations using cycles and relevant energy terms, including: (b) use of bond
        energy data'
- code: '6'
  title: Electrochemistry
  level: AS
  group: Physical chemistry
  subtopics:
  - code: '6.1'
    title: 'Redox processes: electron transfer and changes in oxidation number (oxidation state)'
    learning_outcomes:
    - id: '6.1-1'
      text: calculate oxidation numbers of elements in compounds and ions
    - id: '6.1-2'
      text: use changes in oxidation numbers to help balance chemical equations
    - id: '6.1-3'
      text: explain and use the terms redox, oxidation, reduction and disproportionation in terms of electron
        transfer and changes in oxidation number
    - id: '6.1-4'
      text: explain and use the terms oxidising agent and reducing agent
    - id: '6.1-5'
      text: use a Roman numeral to indicate the magnitude of the oxidation number of an element
- code: '7'
  title: Equilibria
  level: AS
  group: Physical chemistry
  subtopics:
  - code: '7.1'
    title: 'Chemical equilibria: reversible reactions, dynamic equilibrium'
    learning_outcomes:
    - id: '7.1-1a'
      text: understand what is meant by a reversible reaction
    - id: '7.1-1b'
      text: understand what is meant by dynamic equilibrium in terms of the rate of forward and reverse
        reactions being equal and the concentration of reactants and products remaining constant
    - id: '7.1-1c'
      text: understand the need for a closed system in order to establish dynamic equilibrium
    - id: '7.1-2'
      text: 'define Le Chatelier’s principle as: if a change is made to a system at dynamic equilibrium,
        the position of equilibrium moves to minimise this change'
    - id: '7.1-3'
      text: use Le Chatelier’s principle to deduce qualitatively (from appropriate information) the effects
        of changes in temperature, concentration, pressure or presence of a catalyst on a system at equilibrium
    - id: '7.1-4'
      text: deduce expressions for equilibrium constants in terms of concentrations, Kc
    - id: '7.1-5'
      text: use the terms mole fraction and partial pressure
    - id: '7.1-6'
      text: deduce expressions for equilibrium constants in terms of partial pressures, Kp (use of the
        relationship between Kp and Kc is not required)
    - id: '7.1-7'
      text: use the Kc and Kp expressions to carry out calculations (such calculations will not require
        the solving of quadratic equations)
    - id: '7.1-8'
      text: calculate the quantities present at equilibrium, given appropriate data
    - id: '7.1-9'
      text: state whether changes in temperature, concentration or pressure or the presence of a catalyst
        affect the value of the equilibrium constant for a reaction
    - id: '7.1-10'
      text: describe and explain the conditions used in the Haber process and the Contact process, as
        examples of the importance of an understanding of dynamic equilibrium in the chemical industry
        and the application of Le Chatelier’s principle
  - code: '7.2'
    title: Brønsted–Lowry theory of acids and bases
    learning_outcomes:
    - id: '7.2-1'
      text: state the names and formulas of the common acids, limited to hydrochloric acid, HCl, sulfuric
        acid, H2SO4, nitric acid, HNO3, ethanoic acid, CH3COOH
    - id: '7.2-2'
      text: state the names and formulas of the common alkalis, limited to sodium hydroxide, NaOH, potassium
        hydroxide, KOH, ammonia, NH3
    - id: '7.2-3'
      text: describe the Brønsted–Lowry theory of acids and bases
    - id: '7.2-4'
      text: describe strong acids and strong bases as fully dissociated in aqueous solution and weak acids
        and weak bases as partially dissociated in aqueous solution
    - id: '7.2-5'
      text: appreciate that water has pH of 7, acid solutions pH of below 7 and alkaline solutions pH
        of above 7
    - id: '7.2-6'
      text: explain qualitatively the differences in behaviour between strong and weak acids including
        the reaction with a reactive metal and difference in pH values by use of a pH meter, universal
        indicator or conductivity
    - id: '7.2-7'
      text: understand that neutralisation reactions occur when H+(aq) and OH–(aq) form H2O(l)
    - id: '7.2-8'
      text: understand that salts are formed in neutralisation reactions
    - id: '7.2-9'
      text: sketch the pH titration curves of titrations using combinations of strong and weak acids with
        strong and weak alkalis
    - id: '7.2-10'
      text: select suitable indicators for acid-alkali titrations, given appropriate data (pKa values
        will not be used)
- code: '8'
  title: Reaction kinetics
  level: AS
  group: Physical chemistry
  subtopics:
  - code: '8.1'
    title: Rate of reaction
    learning_outcomes:
    - id: '8.1-1'
      text: explain and use the term rate of reaction, frequency of collisions, effective collisions and
        non-effective collisions
    - id: '8.1-2'
      text: explain qualitatively, in terms of frequency of effective collisions, the effect of concentration
        and pressure changes on the rate of a reaction
    - id: '8.1-3'
      text: use experimental data to calculate the rate of a reaction
  - code: '8.2'
    title: Effect of temperature on reaction rates and the concept of activation energy
    learning_outcomes:
    - id: '8.2-1'
      text: define activation energy, EA, as the minimum energy required for a collision to be effective
    - id: '8.2-2'
      text: sketch and use the Boltzmann distribution to explain the significance of activation energy
    - id: '8.2-3'
      text: explain qualitatively, in terms both of the Boltzmann distribution and of frequency of effective
        collisions, the effect of temperature change on the rate of a reaction
  - code: '8.3'
    title: Homogeneous and heterogeneous catalysts
    learning_outcomes:
    - id: '8.3-1a'
      text: 'explain and use the terms catalyst and catalysis: (a) explain that, in the presence of a
        catalyst, a reaction has a different mechanism, i.e. one of lower activation energy'
    - id: '8.3-1b'
      text: 'explain and use the terms catalyst and catalysis: (b) explain this catalytic effect in terms
        of the Boltzmann distribution'
    - id: '8.3-1c'
      text: 'explain and use the terms catalyst and catalysis: (c) construct and interpret a reaction
        pathway diagram, for a reaction in the presence and absence of an effective catalyst'
- code: '9'
  title: 'The Periodic Table: chemical periodicity'
  level: AS
  group: Inorganic chemistry
  subtopics:
  - code: '9.1'
    title: Periodicity of physical properties of the elements in Period 3
    learning_outcomes:
    - id: '9.1-1'
      text: describe qualitatively (and indicate the periodicity in) the variations in atomic radius,
        ionic radius, melting point and electrical conductivity of the elements
    - id: '9.1-2'
      text: explain the variation in melting point and electrical conductivity in terms of the structure
        and bonding of the elements
  - code: '9.2'
    title: Periodicity of chemical properties of the elements in Period 3
    learning_outcomes:
    - id: '9.2-1'
      text: describe, and write equations for, the reactions of the elements with oxygen (to give Na2O,
        MgO, Al 2O3, P4O10, SO2), chlorine (to give NaCl, MgCl 2, Al Cl3, SiCl 4, PCl 5) and water (Na
        and Mg only)
    - id: '9.2-2'
      text: state and explain the variation in the oxidation number of the oxides (Na2O, MgO, Al 2O3,
        P4O10, SO2 and SO3 only) and chlorides (NaCl, MgCl 2, Al Cl3, SiCl4, PCl 5 only) in terms of their
        outer shell (valence shell) electrons
    - id: '9.2-3'
      text: describe, and write equations for, the reactions, if any, of the oxides Na2O, MgO, Al 2O3,
        SiO2, P4O10, SO2 and SO3 with water including the likely pHs of the solutions obtained
    - id: '9.2-4'
      text: describe, explain, and write equations for, the acid / base behaviour of the oxides Na2O,
        MgO, Al 2O3, P4O10, SO2 and SO3 and the hydroxides NaOH, Mg(OH)2 and Al (OH)3 including, where
        relevant, amphoteric behaviour in reactions with acids and bases (sodium hydroxide only)
    - id: '9.2-5'
      text: describe, explain, and write equations for, the reactions of the chlorides NaCl, MgCl 2, Al
        Cl 3, SiCl 4, PCl 5 with water including the likely pHs of the solutions obtained
    - id: '9.2-6'
      text: explain the variations and trends in 9.2.2, 9.2.3, 9.2.4 and 9.2.5 in terms of bonding and
        electronegativity
    - id: '9.2-7'
      text: suggest the types of chemical bonding present in the chlorides and oxides from observations
        of their chemical and physical properties
  - code: '9.3'
    title: Chemical periodicity of other elements
    learning_outcomes:
    - id: '9.3-1'
      text: predict the characteristic properties of an element in a given group by using knowledge of
        chemical periodicity
    - id: '9.3-2'
      text: deduce the nature, possible position in the Periodic Table and identity of unknown elements
        from given information about physical and chemical properties
- code: '10'
  title: Group 2
  level: AS
  group: Inorganic chemistry
  subtopics:
  - code: '10.1'
    title: Similarities and trends in the properties of the Group 2 metals, magnesium to barium, and their
      compounds
    learning_outcomes:
    - id: '10.1-1'
      text: describe, and write equations for, the reactions of the elements with oxygen, water and dilute
        hydrochloric and sulfuric acids
    - id: '10.1-2'
      text: describe, and write equations for, the reactions of the oxides, hydroxides and carbonates
        with water and dilute hydrochloric and sulfuric acids
    - id: '10.1-3'
      text: describe, and write equations for, the thermal decomposition of the nitrates and carbonates,
        to include the trend in thermal stabilities
    - id: '10.1-4'
      text: describe, and make predictions from, the trends in physical and chemical properties of the
        elements involved in the reactions in 10.1.1 and the compounds involved in 10.1.2, 10.1.3 and
        10.1.5
    - id: '10.1-5'
      text: state the variation in the solubilities of the hydroxides and sulfates
- code: '11'
  title: Group 17
  level: AS
  group: Inorganic chemistry
  subtopics:
  - code: '11.1'
    title: Physical properties of the Group 17 elements
    learning_outcomes:
    - id: '11.1-1'
      text: describe the colours and the trend in volatility of chlorine, bromine and iodine
    - id: '11.1-2'
      text: describe and explain the trend in the bond strength of the halogen molecules
    - id: '11.1-3'
      text: interpret the volatility of the elements in terms of instantaneous dipole–induced dipole forces
  - code: '11.2'
    title: The chemical properties of the halogen elements and the hydrogen halides
    learning_outcomes:
    - id: '11.2-1'
      text: describe the relative reactivity of the elements as oxidising agents
    - id: '11.2-2'
      text: describe the reactions of the elements with hydrogen and explain their relative reactivity
        in these reactions
    - id: '11.2-3'
      text: describe the relative thermal stabilities of the hydrogen halides and explain these in terms
        of bond strengths
  - code: '11.3'
    title: Some reactions of the halide ions
    learning_outcomes:
    - id: '11.3-1'
      text: describe the relative reactivity of halide ions as reducing agents
    - id: '11.3-2a'
      text: 'describe and explain the reactions of halide ions with: (a) aqueous silver ions followed
        by aqueous ammonia (the formation and formula of the [Ag(NH3)2]+ complex is not required)'
    - id: '11.3-2b'
      text: 'describe and explain the reactions of halide ions with: (b) concentrated sulfuric acid, to
        include balanced chemical equations'
  - code: '11.4'
    title: The reactions of chlorine
    learning_outcomes:
    - id: '11.4-1'
      text: describe and interpret, in terms of changes in oxidation number, the reaction of chlorine
        with cold and with hot aqueous sodium hydroxide and recognise these as disproportionation reactions
    - id: '11.4-2'
      text: explain, including by use of an equation, the use of chlorine in water purification to include
        the production of the active species HOCl and Cl O– which kill bacteria
- code: '12'
  title: Nitrogen and sulfur
  level: AS
  group: Inorganic chemistry
  subtopics:
  - code: '12.1'
    title: Nitrogen and sulfur
    learning_outcomes:
    - id: '12.1-1'
      text: explain the lack of reactivity of nitrogen, with reference to triple bond strength and lack
        of polarity
    - id: '12.1-2a'
      text: 'describe and explain: (a) the basicity of ammonia, using the Brønsted–Lowry theory'
    - id: '12.1-2b'
      text: 'describe and explain: (b) the structure of the ammonium ion and its formation by an acid–base
        reaction'
    - id: '12.1-2c'
      text: 'describe and explain: (c) the displacement of ammonia from ammonium salts by an acid–base
        reaction'
    - id: '12.1-3'
      text: state and explain the natural and man-made occurrences of oxides of nitrogen and their catalytic
        removal from the exhaust gases of internal combustion engines
    - id: '12.1-4'
      text: understand that atmospheric oxides of nitrogen (NO and NO2) can react with unburned hydrocarbons
        to form peroxyacetyl nitrate, PAN, which is a component of photochemical smog
    - id: '12.1-5'
      text: describe the role of NO and NO2 in the formation of acid rain both directly and in their catalytic
        role in the oxidation of atmospheric sulfur dioxide 13 An introduction to AS Level organic chemistry
        functional group functional group carboxylic acid carboxyl R C OH O H C H H H C C H O O H O OH
        propanoic acid
- code: '13'
  title: An introduction to AS Level organic chemistry
  level: AS
  group: Organic chemistry
  subtopics:
  - code: '13.1'
    title: Formulas, functional groups and the naming of organic compounds
    learning_outcomes:
    - id: '13.1-1'
      text: define the term hydrocarbon as a compound made up of C and H atoms only
    - id: '13.1-2'
      text: understand that alkanes are simple hydrocarbons with no functional group
    - id: '13.1-3'
      text: understand that the compounds in the table on pages 29 and 30 contain a functional group which
        dictates their physical and chemical properties
    - id: '13.1-4'
      text: interpret and use the general, structural, displayed and skeletal formulas of the classes
        of compound stated in the table on pages 29 and 30
    - id: '13.1-5'
      text: understand and use systematic nomenclature of simple aliphatic organic molecules with functional
        groups detailed in the table on pages 29 and 30, up to six carbon atoms (six plus six for esters,
        straight chains only for esters and nitriles)
    - id: '13.1-6'
      text: deduce the molecular and/or empirical formula of a compound, given its structural, displayed
        or skeletal formula
  - code: '13.2'
    title: Characteristic organic reactions
    learning_outcomes:
    - id: '13.2-1a'
      text: 'interpret and use the following terminology associated with types of organic compounds and
        reactions: (a) homologous series'
    - id: '13.2-1b'
      text: 'interpret and use the following terminology associated with types of organic compounds and
        reactions: (b) saturated and unsaturated'
    - id: '13.2-1c'
      text: 'interpret and use the following terminology associated with types of organic compounds and
        reactions: (c) homolytic and heterolytic fission'
    - id: '13.2-1d'
      text: 'interpret and use the following terminology associated with types of organic compounds and
        reactions: (d) free radical, initiation, propagation, termination'
    - id: '13.2-1e'
      text: 'interpret and use the following terminology associated with types of organic compounds and
        reactions: (e) nucleophile, electrophile, nucleophilic, electrophilic'
    - id: '13.2-1f'
      text: 'interpret and use the following terminology associated with types of organic compounds and
        reactions: (f) addition, substitution, elimination, hydrolysis, condensation'
    - id: '13.2-1g'
      text: 'interpret and use the following terminology associated with types of organic compounds and
        reactions: (g) oxidation and reduction (in equations for organic redox reactions, the symbol [O]
        can be used to represent one atom of oxygen from an oxidising agent and the symbol [H] to represent
        one atom of hydrogen from a reducing agent)'
    - id: '13.2-2a'
      text: 'understand and use the following terminology associated with types of organic mechanisms:
        (a) free-radical substitution'
    - id: '13.2-2b'
      text: 'understand and use the following terminology associated with types of organic mechanisms:
        (b) electrophilic addition'
    - id: '13.2-2c'
      text: 'understand and use the following terminology associated with types of organic mechanisms:
        (c) nucleophilic substitution'
    - id: '13.2-2d'
      text: 'understand and use the following terminology associated with types of organic mechanisms:
        (d) nucleophilic addition (in organic reaction mechanisms, the use of curly arrows to represent
        movement of electron pairs is expected; the arrow should begin at a bond or a lone pair of electrons)'
  - code: '13.3'
    title: Shapes of organic molecules; σ and π bonds
    learning_outcomes:
    - id: '13.3-1'
      text: describe organic molecules as either straight-chained, branched or cyclic
    - id: '13.3-2'
      text: describe and explain the shape of, and bond angles in, molecules containing sp, sp2 and sp3
        hybridised atoms
    - id: '13.3-3'
      text: describe the arrangement of σ and π bonds in molecules containing sp, sp2 and sp3 hybridised
        atoms
    - id: '13.3-4'
      text: understand and use the term planar when describing the arrangement of atoms in organic molecules,
        for example ethene
  - code: '13.4'
    title: 'Isomerism: structural isomerism and stereoisomerism'
    learning_outcomes:
    - id: '13.4-1'
      text: describe structural isomerism and its division into chain, positional and functional group
        isomerism
    - id: '13.4-2'
      text: describe stereoisomerism and its division into geometrical (cis/trans) and optical isomerism
        (use of E/Z nomenclature is acceptable but is not required)
    - id: '13.4-3'
      text: describe geometrical (cis/trans) isomerism in alkenes, and explain its origin in terms of
        restricted rotation due to the presence of π bonds
    - id: '13.4-4'
      text: explain what is meant by a chiral centre and that such a centre gives rise to two optical
        isomers (enantiomers) (Candidates should appreciate that compounds can contain more than one chiral
        centre, but knowledge of meso compounds, or nomenclature such as diastereoisomers is not required.)
    - id: '13.4-5'
      text: identify chiral centres and geometrical (cis/trans) isomerism in a molecule of given structural
        formula including cyclic compounds
    - id: '13.4-6'
      text: deduce the possible isomers for an organic molecule of known molecular formula
- code: '14'
  title: Hydrocarbons
  level: AS
  group: Organic chemistry
  subtopics:
  - code: '14.1'
    title: Alkanes
    learning_outcomes:
    - id: '14.1-1a'
      text: 'recall the reactions (reagents and conditions) by which alkanes can be produced: (a) addition
        of hydrogen to an alkene in a hydrogenation reaction, H2(g) and Pt/Ni catalyst and heat'
    - id: '14.1-1b'
      text: 'recall the reactions (reagents and conditions) by which alkanes can be produced: (b) cracking
        of a longer chain alkane, heat with Al 2O3'
    - id: '14.1-2a'
      text: 'describe: (a) the complete and incomplete combustion of alkanes'
    - id: '14.1-2b'
      text: 'describe: (b) the free-radical substitution of alkanes by Cl 2 or Br2 in the presence of
        ultraviolet light, as exemplified by the reactions of ethane'
    - id: '14.1-3'
      text: describe the mechanism of free-radical substitution with reference to the initiation, propagation
        and termination steps
    - id: '14.1-4'
      text: suggest how cracking can be used to obtain more useful alkanes and alkenes of lower Mr from
        heavier crude oil fractions
    - id: '14.1-5'
      text: understand the general unreactivity of alkanes, including towards polar reagents in terms
        of the strength of the C–H bonds and their relative lack of polarity
    - id: '14.1-6'
      text: recognise the environmental consequences of carbon monoxide, oxides of nitrogen and unburnt
        hydrocarbons arising from the combustion of alkanes in the internal combustion engine and of their
        catalytic removal
  - code: '14.2'
    title: Alkenes
    learning_outcomes:
    - id: '14.2-1a'
      text: 'recall the reactions (including reagents and conditions) by which alkenes can be produced:
        (a) elimination of HX from a halogenoalkane by ethanolic NaOH and heat'
    - id: '14.2-1b'
      text: 'recall the reactions (including reagents and conditions) by which alkenes can be produced:
        (b) dehydration of an alcohol, by using a heated catalyst (e.g. Al 2O3) or a concentrated acid
        (e.g. concentrated H2SO4)'
    - id: '14.2-1c'
      text: 'recall the reactions (including reagents and conditions) by which alkenes can be produced:
        (c) cracking of a longer chain alkane'
    - id: '14.2-2a'
      text: 'describe the following reactions of alkenes: (a) the electrophilic addition of (i) hydrogen
        in a hydrogenation reaction, H2(g) and Pt/Ni catalyst and heat (ii) steam, H2O(g) and H3PO4 catalyst
        (iii) a hydrogen halide, HX(g), at room temperature (iv) a halogen, X2'
    - id: '14.2-2b'
      text: 'describe the following reactions of alkenes: (b) the oxidation by cold dilute acidified KMnO4
        to form the diol'
    - id: '14.2-2c'
      text: 'describe the following reactions of alkenes: (c) the oxidation by hot concentrated acidified
        KMnO4 leading to the rupture of the carbon–carbon double bond and the identities of the subsequent
        products to determine the position of alkene linkages in larger molecules'
    - id: '14.2-2d'
      text: 'describe the following reactions of alkenes: (d) addition polymerisation exemplified by the
        reactions of ethene and propene'
    - id: '14.2-3'
      text: describe the use of aqueous bromine to show the presence of a C=C bond
    - id: '14.2-4'
      text: describe the mechanism of electrophilic addition in alkenes, using bromine/ethene and hydrogen
        bromide/propene as examples
    - id: '14.2-5'
      text: describe and explain the inductive effects of alkyl groups on the stability of primary, secondary
        and tertiary cations formed during electrophilic addition (this should be used to explain Markovnikov
        addition)
- code: '15'
  title: Halogen compounds
  level: AS
  group: Organic chemistry
  subtopics:
  - code: '15.1'
    title: Halogenoalkanes
    learning_outcomes:
    - id: '15.1-1a'
      text: 'recall the reactions (reagents and conditions) by which halogenoalkanes can be produced:
        (a) the free-radical substitution of alkanes by Cl2 or Br2 in the presence of ultraviolet light,
        as exemplified by the reactions of ethane'
    - id: '15.1-1b'
      text: 'recall the reactions (reagents and conditions) by which halogenoalkanes can be produced:
        (b) electrophilic addition of an alkene with a halogen, X2, or hydrogen halide, HX(g), at room
        temperature'
    - id: '15.1-1c'
      text: 'recall the reactions (reagents and conditions) by which halogenoalkanes can be produced:
        (c) substitution of an alcohol, e.g. by reaction with HX(g); or with KCl and concentrated H2SO4
