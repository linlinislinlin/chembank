<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>作业统计 · ChemBank</title>
<style>
  :root { --accent:#7c6cf0; --bg:#0f0d1a; --bg-soft:#171427; --panel:#1e1b2e; --panel-2:#262241; --line:#2f2a4a; --text:#eceaf6; --muted:#9b95b8; --green:#4ece9d; --red:#f07c7c; --amber:#f0c17c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; }
  a { color:var(--accent); }
  header { background:var(--bg-soft); border-bottom:1px solid var(--line); padding:14px 22px; display:flex; align-items:center; gap:16px; }
  header h1 { font-size:17px; margin:0; }
  header .nav a { margin-right:18px; font-size:14px; color:var(--muted); text-decoration:none; }
  header .nav a.on { color:#fff; font-weight:600; }
  .wrap { max-width:1000px; margin:0 auto; padding:22px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:18px; }
  .card h2 { font-size:15px; margin:0 0 12px; }
  .pick { display:flex; gap:8px; flex-wrap:wrap; }
  .pill { background:var(--panel-2); border:1px solid var(--line); padding:6px 12px; border-radius:20px; font-size:13px; cursor:pointer; color:var(--muted); }
  .pill.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:600; font-size:12px; }
  .bar { height:8px; background:var(--panel-2); border-radius:5px; overflow:hidden; min-width:80px; }
  .bar i { display:block; height:100%; }
  .green { color:var(--green); } .red { color:var(--red); } .amber{color:var(--amber);}
  .sum-cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px; margin-bottom:18px; }
  .sum { background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:15px; text-align:center; }
  .sum .v { font-size:22px; font-weight:800; color:var(--amber); }
  .sum .k { font-size:12px; color:var(--muted); margin-top:3px; }
  .empty { color:var(--muted); padding:30px; text-align:center; }
  .err { color:var(--red); font-size:13px; }
  .btn { background:var(--panel-2); border:1px solid var(--line); color:var(--text); border-radius:9px; padding:8px 14px; cursor:pointer; font-size:13px; }
  .tag { display:inline-block; background:var(--panel-2); border-radius:6px; padding:1px 7px; font-size:11px; margin:2px; color:var(--muted); }
  .topic-row { display:flex; justify-content:space-between; align-items:center; padding:7px 4px; border-bottom:1px solid var(--line); font-size:13px; }
  .muted { color:var(--muted); }
  .small-note { color:var(--muted); font-size:12px; margin:-6px 0 12px; }
  /* 学生钻取表 */
  tr.stu-main { cursor:pointer; border-bottom:none; }
  tr.stu-main:focus { outline:1px solid var(--accent); outline-offset:-1px; }
  tr.stu-main:hover { background:rgba(124,108,240,.06); }
  tr.stu-main .caret { display:inline-block; width:12px; color:var(--muted); font-size:10px; transition:transform .15s; }
  tr.stu-main.open .caret { transform:rotate(90deg); color:var(--accent); }
  tr.stu-detail { display:none; background:rgba(255,255,255,.03); }
  tr.stu-detail.open { display:table-row; }
  tr.stu-detail.open td { padding:12px 14px; }
  .each-list { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:8px; }
  .each-item { background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:6px 9px; font-size:12px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .each-q { color:var(--muted); }
  .sort-btn { cursor:pointer; user-select:none; }
  .sort-btn:hover { color:var(--text); }
  /* 教师口令门 */
  .gate { max-width:420px; margin:80px auto; padding:0 20px; }
  .gate .card { padding:26px; }
  .gate h2 { margin-top:0; }
  .gate .input { width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--text); border-radius:10px; padding:12px 14px; font-size:15px; }
  .gate .input:focus { outline:none; border-color:var(--accent); }
  .gate .err { color:var(--red); font-size:13px; min-height:20px; }
</style>
</head>
<body>
<header>
  <h1>📊 作业统计</h1>
  <div class="nav">
    <a href="assign.html">布置作业</a>
    <a href="stats.html" class="on">查看统计</a>
    <a href="index.html">刷题库</a>
  </div>
</header>

<!-- 教师口令登录门：口令正确前不加载/也不查询任何统计 -->
<div class="gate" id="loginGate">
  <div class="card" style="text-align:left">
    <h2>🔒 教师口令</h2>
    <p class="small-note" style="margin:0 0 4px">请输入教师口令以查看统计数据。</p>
    <input class="input" id="tokenInput" type="password" placeholder="教师口令" style="margin-top:6px" />
    <div class="err" id="gateErr"></div>
    <button class="btn" id="gateBtn" style="margin-top:4px;width:100%">进入统计</button>
  </div>
</div>

<div class="wrap" id="mainWrap" style="display:none">
  <div class="card">
    <h2>选择作业</h2>
    <div class="pick" id="pickList"><span class="empty" style="padding:0">加载中…</span></div>
  </div>

  <div id="overview" style="display:none">
    <div class="sum-cards" id="sumCards"></div>
    <div class="card">
      <h2>学生作答情况（按正确率排序，点击行展开每题对错）</h2>
      <div class="small-note">点击某学生行可展开，查看该生在每道题的作答对错。</div>
      <table><thead><tr><th>姓名</th><th>学号</th><th>已做 / 总</th><th class="sort-btn" id="stuAccTh" title="点击切换排序">正确率 <span id="stuAccArrow">▾</span></th></tr></thead>
      <tbody id="stuRows"></tbody></table>
      <div class="empty" id="stuEmpty" style="display:none">还没有学生作答</div>
    </div>
    <div class="card">
      <h2>讲义题目分析（每题正确率，错得多的题建议重点讲）</h2>
      <div class="small-note">按正确率从低到高排序，最常做错的题在最上方。</div>
      <table><thead><tr><th>题目</th><th>类型</th><th>分数</th><th>已做 / 总</th><th>正确率</th><th>标准答案</th><th>考点</th></tr></thead>
      <tbody id="qRows"></tbody></table>
      <div class="empty" id="qEmpty" style="display:none">暂无数据</div>
    </div>
    <div class="card">
      <h2>错题知识点分布（哪些考点大家最容易错）</h2>
      <div id="topicDist"></div>
      <div class="empty" id="tEmpty" style="display:none">暂无数据</div>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="structured-data.js"></script>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
"use strict";
const ALL = (window.CHEMBANK_DATA && window.CHEMBANK_DATA.questions) || [];
const STRUCTURED = (window.STRUCTURED_DATA && window.STRUCTURED_DATA.questions) || [];
const BYID = new Map(ALL.map(q => [q.id, q]));
STRUCTURED.forEach(q => BYID.set(q.id, q));
const DB = window.HomeworkDB;

let assignments = [];
async function loadAssignments() {
  try {
    assignments = await DB.listAssignments();
    const pl = document.getElementById("pickList");
    pl.innerHTML = "";
    if (!assignments.length) { pl.innerHTML = '<span class="empty">还没有布置作业。去 <a href="assign.html">布置作业</a></span>'; return; }
    assignments.forEach(a => {
      const p = document.createElement("span");
      p.className = "pill";
      p.textContent = `${a.title} · ${(a.question_ids||[]).length}题`;
      p.onclick = () => selectAssignment(a.id, p);
      pl.appendChild(p);
    });
  } catch (e) {
    document.getElementById("pickList").innerHTML = '<span class="err">加载失败：' + e.message + '</span>';
  }
}

let currentAss = null;
async function selectAssignment(id, pillEl) {
  document.querySelectorAll(".pick .pill").forEach(x=>x.classList.remove("on"));
  if (pillEl) pillEl.classList.add("on");
  const ass = assignments.find(a => a.id === id);
  if (!ass) return;
  const qs = (ass.question_ids||[]).map(qid => BYID.get(qid)).filter(Boolean);
  try {
    // 安全收紧后：anon 已不能直接 select students/answers，
    // 统一走带密钥校验的 Edge Function（readTeacherStats）。
    const rows = await DB.readTeacherStats(id, getToken());
    renderOverview(ass, qs, rows);
  } catch (e) {
    document.getElementById("overview").style.display = "block";
    document.getElementById("overview").innerHTML = '<div class="card err">统计失败：' + e.message + '</div>';
  }
}

let stuSort = { field:"acc", dir:-1 }; // 默认正确率降序
function stuKey(r){ return r.student_id ?? (r.students ? (r.students.student_no+"|"+r.students.name) : JSON.stringify(r.students)); }
function qLabel(q){ return `${q.year||""} ${q.session||""} P${q.paper} Q${q.question}`.replace(/\s+/g," ").trim() || (q.id||""); }

function renderOverview(ass, qs, rows) {
  document.getElementById("overview").style.display = "block";

  const totalStudents = new Set(rows.map(stuKey)).size;
  const attemptCount = rows.length;
  const correctCount = rows.filter(r => r.correct).length;

  // 汇总
  document.getElementById("sumCards").innerHTML = "";
  const mk = (v,k)=>{const d=document.createElement("div");d.className="sum";d.innerHTML=`<div class="v">${v}</div><div class="k">${k}</div>`;return d;};
  const sc = document.getElementById("sumCards");
  sc.appendChild(mk(totalStudents, "已提交学生"));
  sc.appendChild(mk(attemptCount, "作答次数"));
  sc.appendChild(mk(attemptCount?Math.round(correctCount/attemptCount*100)+"%":"–", "整体正确率"));

  renderStudentTable(rows, qs, totalStudents);
  renderHandoutTable(rows, qs, totalStudents);

  // 错题知识点分布
  const tEmpty = document.getElementById("tEmpty");
  const wrongRows = rows.filter(r => !r.correct);
  const topicCnt = new Map();
  wrongRows.forEach(r => {
    const q = BYID.get(r.question_id);
    (q?.topics||[]).forEach(t => topicCnt.set(t, (topicCnt.get(t)||0)+1));
  });
  const td = document.getElementById("topicDist");
  td.innerHTML = "";
  tEmpty.style.display = topicCnt.size ? "none" : "block";
  [...topicCnt.entries()].sort((a,b)=>b[1]-a[1]).slice(0,15).forEach(([t,c]) => {
    const d = document.createElement("div");
    d.className = "topic-row";
    d.innerHTML = `<span>${esc(t)}</span><b class="red">${c} 次做错</b>`;
    td.appendChild(d);
  });
}

// 学生作答情况：一行一名学生，按正确率排序；点击展开每题对错
function renderStudentTable(rows, qs, totalStudents) {
  // 汇总每位学生
  const byStu = new Map();
  const ansMapByStu = new Map();
  rows.forEach(r => {
    const k = stuKey(r);
    if(!byStu.has(k)) byStu.set(k, { stu:r.students, n:0, ok:0, acc:0 });
    const s = byStu.get(k);
    s.n++; if(r.correct) s.ok++;
    if(!ansMapByStu.has(k)) ansMapByStu.set(k, new Map());
    ansMapByStu.get(k).set(r.question_id, r);
  });
  const list = [...byStu.entries()].map(([key, s]) => ({...s, key, acc: s.n? s.ok/s.n : 0}));
  list.sort((a,b) => stuSort.dir * (a.acc - b.acc));

  const st = document.getElementById("stuRows"); st.innerHTML = "";
  document.getElementById("stuEmpty").style.display = list.length ? "none" : "block";
  document.getElementById("stuAccArrow").textContent = stuSort.dir < 0 ? "▾" : "▴";
  document.getElementById("stuAccTh").onclick = () => { stuSort.dir *= -1; renderStudentTable(rows, qs, totalStudents); };

  list.forEach(({stu, n, ok, acc, key}) => {
    const accPct = Math.round(acc*100);
    const color = accPct>=80?"green":accPct>=50?"amber":"red";
    const main = document.createElement("tr");
    main.className = "stu-main";
    main.setAttribute("tabindex","0");
    main.setAttribute("aria-expanded","false");
    main.innerHTML = `<td><span class="caret">▶</span> ${esc(stu?.name||"?")}</td>
      <td>${esc(stu?.student_no||"–")}</td>
      <td>${ok}/${n}</td>
      <td><div style="display:flex;align-items:center;gap:8px">
        <div class="bar"><i style="width:${accPct}%;background:var(--${color});height:100%;border-radius:5px"></i></div>
        <b class="${color}">${accPct}%</b></div></td>`;

    // 展开行：列出作业中每道题，标记本生作答对错
    const det = document.createElement("tr");
    det.className = "stu-detail";
    const ansMap = ansMapByStu.get(key) || new Map();
    const items = qs.map(q => {
      const a = ansMap.get(q.id);
      let cls, icon;
      if(!a){ cls = "muted"; icon = "–"; }
      else if(a.correct){ cls = "green"; icon = "✓ 对"; }
      else { cls = "red"; icon = "✗ 错"; }
      return `<div class="each-item"><span class="each-q">${esc(qLabel(q))}</span><b class="${cls}">${icon}</b></div>`;
    }).join("");
    det.innerHTML = `<td colspan="4"><div class="each-list">${items}</div></td>`;

    const toggle = () => {
      const opening = !main.classList.contains("open");
      main.classList.toggle("open", opening);
      det.classList.toggle("open", opening);
      main.setAttribute("aria-expanded", String(opening));
    };
    main.onclick = toggle;
    main.onkeydown = (e)=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); toggle(); } };

    st.appendChild(main);
    st.appendChild(det);
  });
}

// 讲义题目分析：每道题 正确率/答卷数/标准答案/考点，错得多的在前
function renderHandoutTable(rows, qs, totalStudents) {
  const qt = document.getElementById("qRows"); qt.innerHTML = "";
  const qEmpty = document.getElementById("qEmpty");
  const perQ = qs.map(q => {
    const hits = rows.filter(r => r.question_id === q.id);
    const ok = hits.filter(h => h.correct).length;
    return { q, answered:hits.length, ok };
  });
  perQ.sort((a,b) => {
    const aa = a.answered ? a.ok/a.answered : 1; // 无人作答视为满分，排在最后
    const bb = b.answered ? b.ok/b.answered : 1;
    if(aa !== bb) return aa - bb;              // 正确率升序 → 最常做错的在前
    return qs.indexOf(a.q) - qs.indexOf(b.q);  // 相同时按作业顺序
  });
  qEmpty.style.display = perQ.length ? "none" : "block";

  perQ.forEach(({q, answered, ok}) => {
    const acc = answered ? Math.round(ok/answered*100) : null;
    const color = acc==null ? "" : (acc>=80?"green":acc>=50?"amber":"red");
    const isStructured = q.type === "structured";
    const typeTag = isStructured
      ? '<span class="tag" style="color:var(--amber)">自评</span>'
      : '<span class="tag">选择</span>';
    const ms = isStructured
      ? '<span class="muted">自评题 · 无标准答案</span>'
      : (q.ms_answer ? `<b class="green">${esc(q.ms_answer)}</b>` : '<span class="muted">–</span>');
    const marksCell = q.marks!=null ? q.marks : '<span class="muted">–</span>';
    const accCell = acc==null
      ? '<span class="muted">–</span>'
      : `<div style="display:flex;align-items:center;gap:8px"><div class="bar"><i style="width:${acc}%;background:var(--${color});height:100%;border-radius:5px"></i></div><b class="${color}">${acc}%</b></div>`;
    const topic = (q.topics&&q.topics.length) ? q.topics.slice(0,2).map(esc).join("；") : '<span class="muted">–</span>';

    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${esc(qLabel(q))}</td>
      <td>${typeTag}</td>
      <td>${marksCell}</td>
      <td>${answered} / ${totalStudents}</td>
      <td>${accCell}</td>
      <td>${ms}</td>
      <td>${topic}</td>`;
    qt.appendChild(tr);
  });
}

function esc(s){ const d=document.createElement("div"); d.textContent=s==null?"":String(s); return d.innerHTML; }

// ============================================================
// 教师口令门
// ------------------------------------------------------------
// ⚠️ 安全界限说明：`cfg.statsToken` 是打包进公开前端的明文口令，
//    它只能挡“顺手点开 stats.html 的老师/学生”，**不能当作安全边界**。
//    懂行的人直接看 config.js 就能拿到这个口令。
//    本页面的口令只是 UI 门；真正防数据泄露的是后端两道防线：
//      1) hardening-rls.sql 撤销了 students/answers 的 anon select，
//         懂行的人绕过本页面也 REST select 不到这两张表（返回空/报错）；
//      2) 统计真正读数据走 stats-edge 函数 + 服务端密钥 TEACHER_TOKEN，
//         该密钥只在 Supabase secrets 里，前端口令不等于它能读数据。
// ============================================================
const cfg = window.SUPABASE_CONFIG || {};
let __token = null;

function getToken() { return __token; }

function verifyToken(input) {
  // 前端口径校验：与 config.js 的 statsToken 比对。
  // 若 statsEdgeUrl 未部署，这里放行后真正读数据仍会因接口未配置而报错，
  // 用户在界面上会看到明确中文提示。
  const expected = (cfg.statsToken || "").trim();
  if (!expected) return { ok: false, msg: "config.js 未设置 statsToken" };
  return { ok: input === expected, msg: input === expected ? "" : "口令错误" };
}

function setupGate() {
  const input = document.getElementById("tokenInput");
  const err = document.getElementById("gateErr");
  const btn = document.getElementById("gateBtn");

  const unlock = () => {
    const v = verifyToken(input.value.trim());
    if (!v.ok) { err.textContent = v.msg; input.focus(); return; }
    __token = input.value.trim();
    // 记住口令（仅当次会话），刷新页面不用再输
    try { sessionStorage.setItem("stats-token", __token); } catch (e) {}
    document.getElementById("loginGate").style.display = "none";
    document.getElementById("mainWrap").style.display = "block";
    loadAssignments();
  };
  btn.onclick = unlock;
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); unlock(); } });

  // 本会话已通过 → 跳过登录，直接进入
  try {
    const cached = sessionStorage.getItem("stats-token");
    if (cached) { __token = cached; document.getElementById("loginGate").style.display = "none"; document.getElementById("mainWrap").style.display = "block"; loadAssignments(); return; }
  } catch (e) {}
  input.focus();
}

setupGate();
</script>
</body>
</html>
