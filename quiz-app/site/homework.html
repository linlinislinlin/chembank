<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Homework · ChemBank</title>
<style>
  :root { --accent:#7c6cf0; --bg:#0f0d1a; --bg-soft:#171427; --panel:#1e1b2e; --panel-2:#262241; --line:#2f2a4a; --text:#eceaf6; --muted:#9b95b8; --green:#4ece9d; --red:#f07c7c; --amber:#f0c17c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; min-height:100vh; }
  .top { background:var(--bg-soft); border-bottom:1px solid var(--line); padding:14px 22px; display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:10; }
  .top h1 { font-size:16px; margin:0; }
  .top .meta { font-size:12px; color:var(--muted); }
  .wrap { max-width:760px; margin:0 auto; padding:24px 20px 80px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; box-shadow:0 8px 30px rgba(0,0,0,.3); padding:22px; margin-bottom:16px; }
  .center { text-align:center; }
  .big { font-size:40px; margin:10px 0; }
  label { display:block; font-size:13px; color:var(--muted); margin:14px 0 4px; }
  .input, textarea { background:var(--panel-2); border:1px solid var(--line); color:var(--text); border-radius:10px; padding:12px 14px; width:100%; font-size:16px; font-family:inherit; }
  .input:focus, textarea:focus { outline:none; border-color:var(--accent); }
  .pick { position:relative; text-align:left; }
  .pick-btn { width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px; text-align:left; background:#262241; border:1px solid var(--line); border-radius:12px; padding:14px 16px; color:var(--text); font-family:inherit; font-size:16px; cursor:pointer; }
  .pick-btn .lab { flex:1; }
  .pick-btn .chev { color:var(--muted); font-size:13px; }
  .pick-btn:hover, .pick.open .pick-btn { border-color:var(--accent); }
  .pick-menu { display:none; position:absolute; left:0; right:0; top:calc(100% + 6px); z-index:20; background:#262241; border:1px solid var(--line); border-radius:12px; max-height:260px; overflow:auto; }
  .pick.open .pick-menu { display:block; }
  .pick-opt { display:block; width:100%; text-align:left; background:transparent; border:none; color:var(--text); font-family:inherit; font-size:15px; padding:12px 16px; cursor:pointer; }
  .pick-opt:hover, .pick-opt.on { background:#1e1b2e; }
  textarea { min-height:88px; resize:vertical; }
  .btn { background:var(--accent); color:#fff; border:none; border-radius:11px; padding:13px 20px; font-size:16px; font-weight:600; cursor:pointer; width:100%; margin-top:18px; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .qhead { display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--muted); padding-bottom:12px; border-bottom:1px solid var(--line); margin-bottom:16px; }
  .qhead b { color:var(--accent); }
  .qfig img { max-width:100%; max-height:70vh; border:1px solid var(--line); border-radius:9px; background:#fff; }
  .qfig { text-align:center; margin:16px 0; }
  .topics { font-size:12px; color:var(--muted); margin:12px 0; display:flex; gap:6px; flex-wrap:wrap; }
  .topics span { background:var(--panel-2); padding:2px 8px; border-radius:6px; }
  .ans { display:flex; gap:10px; margin-top:16px; }
  .abtn { flex:1; padding:16px 0; border-radius:11px; background:var(--panel-2); border:2px solid var(--line); font-size:19px; font-weight:700; color:var(--text); cursor:pointer; }
  .abtn.on { border-color:var(--accent); background:rgba(124,108,240,.18); }
  .abtn.correct { border-color:var(--green); background:rgba(78,206,157,.15); color:var(--green); }
  .abtn.wrong { border-color:var(--red); background:rgba(240,124,124,.15); color:var(--red); }
  .typebadge { display:inline-block; font-size:11px; padding:2px 9px; border-radius:20px; background:rgba(124,108,240,.18); color:var(--accent); margin-left:8px; }
  .msfig { margin-top:12px; text-align:center; }
  .msfig img { max-width:100%; max-height:70vh; border:1px solid var(--line); border-radius:9px; background:#fff; }
  .hint { font-size:12px; color:var(--muted); margin-top:10px; }
  .instr { color:var(--text); font-size:14px; line-height:1.55; white-space:pre-wrap; }
  .stat-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:12px; margin:20px 0; }
  .stat { background:var(--panel-2); border-radius:11px; padding:14px; text-align:center; }
  .stat .v { font-size:24px; font-weight:800; color:var(--green); }
  .stat .k { font-size:12px; color:var(--muted); margin-top:3px; }
  .err { color:var(--red); font-size:13px; margin-top:8px; }
  .review { font-size:14px; margin-top:12px; }
  .review .ok { color:var(--green); }
  .review .no { color:var(--red); }
  .review .pend { color:var(--amber); }
</style>
</head>
<body>
<div class="top">
  <h1>📝 Chemistry Homework</h1>
  <span class="meta" id="topMeta">Loading…</span>
  <span class="meta" style="margin-left:auto;text-decoration:underline;"><a href="home.html" id="homeLink" style="color:var(--accent)">🏠 Home</a></span>
</div>

<div class="wrap">
  <div class="card center" id="idCard" style="display:none">
    <div class="big">🧑‍🎓</div>
    <h2 id="idTitle">First, tell us who you are</h2>
    <p class="hint" id="idInstr"></p>
    <button type="button" class="btn" id="testerBtn" style="background:var(--amber);color:#3a2a00;margin-top:8px">Teacher check — use Tester</button>
    <label>Class</label>
    <div class="pick" id="iclassPick">
      <button type="button" class="pick-btn" id="iclassBtn"><span class="lab">All students</span><span class="chev">▼</span></button>
      <div class="pick-menu" id="iclassMenu"></div>
    </div>
    <label>Your name</label>
    <div class="pick" id="inamePick">
      <button type="button" class="pick-btn" id="inameBtn"><span class="lab">Select your name…</span><span class="chev">▼</span></button>
      <div class="pick-menu" id="inameMenu"></div>
    </div>
    <label>Student number</label>
    <input class="input" id="istudentNo" placeholder="Type your student number" autocomplete="off" />
    <button class="btn" id="startBtn">Start →</button>
    <div class="err" id="idErr"></div>
  </div>

  <div id="quizWrap" style="display:none">
    <div class="card" id="instrCard" style="display:none">
      <h2 style="margin-top:0;font-size:16px">Instructions</h2>
      <div class="instr" id="instrText"></div>
    </div>
    <div id="qCards"></div>
    <div class="card">
      <div class="hint">Answer every question, then submit. You will not see the mark scheme until you submit.</div>
      <button class="btn" id="submitBtn">Submit assignment</button>
      <div class="err" id="subErr"></div>
    </div>
  </div>

  <div class="card center" id="doneCard" style="display:none">
    <div class="big">🎉</div>
    <h2 id="doneTitle">Submitted</h2>
    <div class="stat-grid" id="doneStats"></div>
    <div id="doneReview"></div>
  </div>

  <div class="card" id="errCard" style="display:none">
    <div class="big">⚠️</div>
    <h2 id="errMsg">Failed to load</h2>
  </div>
</div>

<script src="roster.js?v=20260906ab"></script>
<script src="config.js?v=20260906ab"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js?v=20260906ab"></script>
<script>
"use strict";
const DB = window.HomeworkDB;
const Portal = window.ChemBankPortal;
const chosen = {};
let assignment = null;
let identity = null;
let track = "as";
let classValue = "";
let nameValue = "";

function currentTrack() {
  const q = new URLSearchParams(location.search).get("track");
  if (q === "ig" || q === "as") return q;
  return Portal.trackOf(assignment || {});
}

function closePicks() {
  document.querySelectorAll(".pick").forEach((p) => p.classList.remove("open"));
}

function fillPick(menuId, btnId, items, current, onPick) {
  const menu = document.getElementById(menuId);
  const btn = document.getElementById(btnId);
  menu.innerHTML = "";
  items.forEach((item) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "pick-opt" + (item.value === current ? " on" : "");
    b.textContent = item.label;
    b.onclick = () => {
      onPick(item.value, item.label);
      closePicks();
    };
    menu.appendChild(b);
  });
  const chosen = items.find((x) => x.value === current);
  btn.querySelector(".lab").textContent = chosen ? chosen.label : items[0].label;
}

function fillClassOptions() {
  const items = Portal.classOptions(track);
  if (!items.some((o) => o.value === classValue)) classValue = items[0] ? items[0].value : "";
  fillPick("iclassMenu", "iclassBtn", items, classValue, (value) => {
    classValue = value;
    nameValue = "";
    fillClassOptions();
    fillRoster();
  });
}

init();

async function init() {
  const id = Number(new URLSearchParams(location.search).get("id"));
  if (!id) {
    document.getElementById("errMsg").textContent = "Open this page from a teacher-provided assignment link.";
    document.getElementById("errCard").style.display = "block";
    return;
  }
  try {
    assignment = await DB.takeAssignment(id);
    if (!assignment || !(assignment.questions || []).length) {
      throw new Error("No available questions in this assignment");
    }
    document.title = (assignment.title || "Homework") + " · ChemBank";
    document.getElementById("topMeta").textContent = assignment.title || "Homework";
    document.getElementById("idTitle").textContent = assignment.title || "Homework";
    document.getElementById("idInstr").textContent = assignment.instructions
      ? assignment.instructions.slice(0, 240)
      : "Select your name from the class list. Answers stay hidden until you submit.";
    track = currentTrack();
    document.getElementById("homeLink").href = Portal.homeHref(track);
    fillClassOptions();
    document.getElementById("idCard").style.display = "block";
    fillRoster();
  } catch (e) {
    showErr(e.message);
  }
}

function rosterList() {
  const all = Portal.roster(track);
  const klass = classValue;
  const testers = all.filter((s) => s.class === "T" || s.student_no === "TESTER");
  const rest = all
    .filter((s) => s.class !== "T" && s.student_no !== "TESTER")
    .filter((s) => !klass || klass === "T" || s.class === klass)
    .slice()
    .sort((a, b) => (a.name || "").localeCompare(b.name || ""));
  if (klass === "T") return testers;
  return testers.concat(rest);
}

function fillRoster() {
  const items = [{ value: "", label: "Select your name…" }].concat(
    rosterList().map((s) => ({
      value: s.student_no,
      label: s.name + "  " + s.name_zh + "  (" + s.class_name + ")",
    }))
  );
  if (!items.some((o) => o.value === nameValue)) nameValue = "";
  fillPick("inameMenu", "inameBtn", items, nameValue, (value) => {
    nameValue = value;
    fillRoster();
  });
}

function pickTester() {
  classValue = "T";
  nameValue = "TESTER";
  fillClassOptions();
  fillRoster();
}

document.getElementById("testerBtn").onclick = pickTester;

function selectedStudent() {
  return Portal.roster(track).find((s) => s.student_no === nameValue) || null;
}

document.getElementById("iclassBtn").onclick = (e) => {
  e.stopPropagation();
  const pick = document.getElementById("iclassPick");
  const open = !pick.classList.contains("open");
  closePicks();
  if (open) pick.classList.add("open");
};
document.getElementById("inameBtn").onclick = (e) => {
  e.stopPropagation();
  const pick = document.getElementById("inamePick");
  const open = !pick.classList.contains("open");
  closePicks();
  if (open) pick.classList.add("open");
};
document.addEventListener("click", closePicks);

document.getElementById("startBtn").onclick = async () => {
  const stu = selectedStudent();
  const err = document.getElementById("idErr");
  if (!stu) { err.textContent = "Please select your name from the list"; return; }
  const typedNo = document.getElementById("istudentNo").value.trim();
  if (!typedNo) { err.textContent = "Type your student number to confirm it is you"; return; }
  if (typedNo !== stu.student_no) { err.textContent = "Student number does not match this name"; return; }
  const name = stu.name;
  const no = stu.student_no;
  const className = stu.class_name;
  identity = { name, studentNo: no, className };
  try {
    const prev = await DB.getSubmissionResult({
      assignmentId: assignment.id, name, studentNo: no, className,
    });
    if (prev && prev.already_submitted) {
      if (prev.review === false) showLocked();
      else showResult(prev);
      return;
    }
  } catch (e) { /* first attempt */ }
  document.getElementById("idCard").style.display = "none";
  renderQuiz();
};

function qImg(q) {
  if (q.type === "structured") return q.paper_img || "";
  return (q.figures && q.figures[0]) || "";
}

function qLabel(q, i) {
  const ref = [q.year, q.session, q.paper != null ? "P" + q.paper : "", q.question != null ? "Q" + q.question : ""]
    .filter(Boolean).join(" ");
  return "Q" + (i + 1) + (ref ? " · " + ref : "");
}

function renderQuiz() {
  document.getElementById("quizWrap").style.display = "block";
  if (assignment.instructions) {
    document.getElementById("instrCard").style.display = "block";
    document.getElementById("instrText").textContent = assignment.instructions;
  }
  const box = document.getElementById("qCards");
  box.innerHTML = "";
  (assignment.questions || []).forEach((q, i) => {
    const card = document.createElement("div");
    card.className = "card";
    const badge = q.type === "structured"
      ? '<span class="typebadge">structured · self-review after submit</span>'
      : '<span class="typebadge">MCQ</span>';
    card.innerHTML = `<div class="qhead"><span>${qLabel(q, i)} ${badge}</span><span>${q.marks || 1} mark</span></div>
      <div class="qfig"></div>
      <div class="topics"></div>
      <div class="ans"></div>`;
    const fig = card.querySelector(".qfig");
    const src = qImg(q);
    if (src) {
      const img = document.createElement("img");
      img.src = src;
      img.onerror = () => { img.style.display = "none"; };
      fig.appendChild(img);
    }
    const tp = card.querySelector(".topics");
    (q.topics || []).slice(0, 3).forEach((t) => {
      const s = document.createElement("span"); s.textContent = t; tp.appendChild(s);
    });
    const ans = card.querySelector(".ans");
    if (q.type === "structured") {
      ans.style.display = "block";
      const ta = document.createElement("textarea");
      ta.className = "input";
      ta.placeholder = "Write your answer (or type done if you answered on paper)";
      ta.oninput = () => { chosen[q.id] = ta.value.trim(); };
      ans.appendChild(ta);
    } else {
      ["A", "B", "C", "D"].forEach((letter) => {
        const b = document.createElement("button");
        b.className = "abtn";
        b.textContent = letter;
        b.onclick = () => {
          chosen[q.id] = letter;
          ans.querySelectorAll(".abtn").forEach((x) => x.classList.toggle("on", x.textContent === letter));
        };
        ans.appendChild(b);
      });
    }
    box.appendChild(card);
  });
}

document.getElementById("submitBtn").onclick = async () => {
  const btn = document.getElementById("submitBtn");
  const err = document.getElementById("subErr");
  const missing = (assignment.questions || []).filter((q) => !chosen[q.id]);
  if (missing.length) {
    err.textContent = "Please answer every question before submitting. (" + missing.length + " left)";
    return;
  }
  btn.disabled = true;
  err.textContent = "";
  try {
    const result = await DB.submitAssignment({
      assignmentId: assignment.id,
      name: identity.name,
      studentNo: identity.studentNo,
      className: identity.className,
      answers: (assignment.questions || []).map((q) => ({ question_id: q.id, chosen: chosen[q.id] })),
    });
    if (result.review === false) showLocked();
    else showResult(result);
  } catch (e) {
    err.textContent = e.message;
    btn.disabled = false;
  }
};

function showLocked() {
  document.getElementById("idCard").style.display = "none";
  document.getElementById("quizWrap").style.display = "none";
  document.getElementById("doneCard").style.display = "block";
  document.getElementById("doneTitle").textContent = "Already submitted";
  document.getElementById("doneStats").innerHTML = "";
  document.getElementById("doneReview").innerHTML =
    '<p class="hint">This name has already handed in. Answers and the mark scheme appear only once, immediately after you submit your own work. They are not shown if someone later picks this name. Teachers can see scores on the stats page.</p>';
}

function showResult(result) {
  document.getElementById("idCard").style.display = "none";
  document.getElementById("quizWrap").style.display = "none";
  document.getElementById("doneCard").style.display = "block";
  document.getElementById("doneTitle").textContent = (result.assignment && result.assignment.title || "Homework") + " · Submitted";
  const st = document.getElementById("doneStats");
  st.innerHTML = "";
  const mk = (v, k) => {
    const d = document.createElement("div");
    d.className = "stat";
    d.innerHTML = `<div class="v">${v}</div><div class="k">${k}</div>`;
    return d;
  };
  st.appendChild(mk(result.score + " / " + result.total_score, "Score"));
  st.appendChild(mk((result.accuracy ?? 0) + "%", "Accuracy"));
  st.appendChild(mk((result.items || []).length, "Questions"));

  const byId = new Map((result.items || []).map((it) => [it.question_id, it]));
  const qs = (result.assignment && result.assignment.questions) || assignment.questions || [];
  const review = document.createElement("div");
  qs.forEach((q, i) => {
    const it = byId.get(q.id) || {};
    const card = document.createElement("div");
    card.className = "card";
    card.style.textAlign = "left";
    let verdict = '<span class="pend">Awaiting teacher mark</span>';
    if (it.is_correct === true) verdict = '<span class="ok">Correct</span>';
    if (it.is_correct === false) verdict = '<span class="no">Incorrect</span>';
    const img = qImg(q);
    card.innerHTML = `<div class="qhead"><span>${qLabel(q, i)}</span><span class="review">${verdict}</span></div>
      ${img ? `<div class="qfig"><img src="${img}"></div>` : ""}
      <div class="review">Your answer: <b>${esc(it.chosen || "–")}</b></div>
      ${it.ms_answer ? `<div class="review">Correct answer: <b class="ok">${esc(it.ms_answer)}</b></div>` : ""}`;
    if (it.ms_img) {
      const ms = document.createElement("div");
      ms.className = "msfig";
      ms.innerHTML = `<img src="${esc(it.ms_img)}" alt="Mark scheme">`;
      card.appendChild(ms);
    }
    review.appendChild(card);
  });
  const box = document.getElementById("doneReview");
  box.innerHTML = "";
  box.appendChild(review);
}

function showErr(msg) {
  document.getElementById("errCard").style.display = "block";
  document.getElementById("errMsg").textContent = msg;
}
function esc(s) {
  const d = document.createElement("div");
  d.textContent = s == null ? "" : String(s);
  return d.innerHTML;
}
</script>
</body>
</html>
