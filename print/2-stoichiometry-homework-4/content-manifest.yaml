  text: 'A washing powder contains sodium hydrogencarbonate, \ce{NaHCO3}, as one of
    the ingredients.


    In a titration, a solution containing 1.00\,g of this washing powder requires
    7.15\,cm$^3$ of 0.100\,mol\,dm$^{-3}$ sulfuric acid for complete reaction. The
    sodium hydrogencarbonate is the only ingredient that reacts with the acid.


    What is the percentage by mass of sodium hydrogencarbonate in the washing powder?

    \optrow{3.0\%}{6.0\%}{12.0\%}{24.0\%}'
