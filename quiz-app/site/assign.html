<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>布置作业 · ChemBank</title>
<style>
  :root { --accent:#7c6cf0; --bg:#0f0d1a; --bg-soft:#171427; --panel:#1e1b2e; --panel-2:#262241; --line:#2f2a4a; --text:#eceaf6; --muted:#9b95b8; --green:#4ece9d; --red:#f07c7c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; }
  a { color:var(--accent); }
  header { background:var(--bg-soft); border-bottom:1px solid var(--line); padding:14px 22px; display:flex; align-items:center; gap:16px; position:sticky; top:0; z-index:10; }
  header h1 { font-size:17px; margin:0; }
  header .nav a { margin-right:18px; font-size:14px; color:var(--muted); text-decoration:none; }
  header .nav a.on { color:#fff; font-weight:600; }
  .wrap { max-width:1180px; margin:0 auto; padding:22px; }
  .grid { display:grid; grid-template-columns:300px 260px 1fr; gap:18px; align-items:start; }
  @media(max-width:1060px){ .grid{ grid-template-columns:1fr 1fr; } }
  @media(max-width:720px){ .grid{ grid-template-columns:1fr; } }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; }
  .card h2 { font-size:15px; margin-top:0; }
  .input, textarea, select { background:var(--panel-2); border:1px solid var(--line); color:var(--text); border-radius:9px; padding:9px 12px; width:100%; font-size:14px; }
  .input:focus { outline:none; border-color:var(--accent); }
  label { display:block; font-size:12px; color:var(--muted); margin:12px 0 4px; }
  .btn { background:var(--accent); color:#fff; border:none; border-radius:10px; padding:11px 18px; font-size:14px; font-weight:600; cursor:pointer; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .btn.green { background:var(--green); color:#06241a; }
  .btn.ghost { background:var(--panel-2); color:var(--text); }
  .search { margin-bottom:12px; }
  #selbar { display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
  #selbar .count { background:var(--accent); color:#fff; border-radius:20px; padding:3px 12px; font-size:13px; }
  #qlist { display:flex; flex-direction:column; gap:8px; max-height:72vh; overflow:auto; }
  .qitem { display:flex; gap:10px; background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:8px 10px; align-items:center; cursor:pointer; }
  .qitem input { accent-color:var(--accent); width:17px; height:17px; }
  .qitem .thumb { width:56px; height:56px; object-fit:contain; background:#fff; border-radius:6px; flex:0 0 56px; }
  .qitem .info { flex:1; font-size:12px; }
  .qitem .info b { display:block; font-size:13px; }
  .qitem .info .sub { color:var(--muted); }
  .filters { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .filters button { background:var(--panel-2); border:1px solid var(--line); color:var(--muted); border-radius:20px; padding:4px 12px; font-size:12px; cursor:pointer; }
  .filters button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .linkbox { background:#0b0a14; border:1px dashed var(--line); border-radius:9px; padding:10px; font-size:12px; word-break:break-all; margin-top:10px; white-space:pre-wrap; }
  .msg { margin-top:10px; font-size:13px; }
  .msg.ok { color:var(--green); }
  .msg.err { color:var(--red); }
  .empty { color:var(--muted); padding:30px; text-align:center; }
  /* 考纲树 */
  .syl { overflow:auto; max-height:72vh; }
  .syl-chap { font-size:12px; font-weight:700; color:var(--text); padding:8px 10px; cursor:pointer; border-radius:7px; display:flex; justify-content:space-between; align-items:center; user-select:none; }
  .syl-chap:hover { background:var(--panel-2); }
  .syl-chap .caret { transition:transform .15s; font-size:10px; color:var(--muted); }
  .syl-chap.open .caret { transform:rotate(90deg); }
  .syl-sub { padding-left:14px; }
  .syl-topic { display:flex; justify-content:space-between; align-items:center; font-size:13px; padding:6px 10px; cursor:pointer; border-radius:6px; color:var(--muted); }
  .syl-topic:hover { background:var(--panel-2); color:var(--text); }
  .syl-topic.on { background:var(--accent); color:#fff; font-weight:600; }
  .syl-topic .n { font-size:11px; color:var(--muted); background:var(--panel-2); border-radius:10px; padding:0 7px; }
  .syl-topic.on .n { color:#fff; background:rgba(255,255,255,.2); }
  .selpill { display:inline-block; background:var(--panel-2); border-radius:6px; padding:1px 7px; font-size:10px; color:var(--muted); margin-left:6px; }
</style>
</head>
<body>
<header>
  <h1>⚗️ ChemBank 作业后台</h1>
  <div class="nav">
    <a href="assign.html" class="on">布置作业</a>
    <a href="stats.html">查看统计</a>
    <a href="index.html">刷题库</a>
  </div>
</header>

<div class="wrap">
  <div class="grid">
    <!-- 左栏：作业设置 -->
    <div>
      <div class="card">
        <h2>1 · 新建作业</h2>
        <label>作业标题</label>
        <input class="input" id="title" placeholder="例如：5.1 键能 & 焓变 · 第3周作业" />
        <label>截止时间（可选）</label>
        <input class="input" type="datetime-local" id="due" />
        <label>已选题目</label>
        <div id="selbar"><span class="count" id="selCount">已选 0 题</span></div>
        <button class="btn green" id="createBtn" style="width:100%">创建作业并生成链接 →</button>
        <div class="msg" id="createMsg"></div>
      </div>
      <div class="card" id="linkCard" style="display:none;margin-top:14px">
        <h2>2 · 把链接发给学生</h2>
        <div class="linkbox" id="linkBox"></div>
        <button class="btn ghost" style="margin-top:8px" onclick="copyLink()">复制链接</button>
      </div>
    </div>

    <!-- 中栏：考纲树 -->
    <div class="card">
      <h2>按考纲选题</h2>
      <div class="syl" id="sylTree"></div>
    </div>

    <!-- 右栏：题目列表 -->
    <div class="card">
      <h2 id="topicTitle">题目</h2>
      <input class="input search" id="qsearch" placeholder="🔍 在当前考点内搜索…" />
      <div class="filters" id="filters">
        <button data-f="cur" class="on">当前考点</button>
        <button data-f="all">全库</button>
        <button data-f="my">仅已选</button>
      </div>
      <div id="qlist"></div>
      <div class="empty" id="qempty" style="display:none">没有匹配的题</div>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script>
"use strict";
const DATA = window.CHEMBANK_DATA || {};
const ALL = DATA.questions || [];
const SYL = DATA.syllabus || [];
const selected = new Set();

const $ = (id) => document.getElementById(id);

// code -> questions map
const BYCODE = new Map();
ALL.forEach(q => (q.codes||[]).forEach(c => {
  if (!BYCODE.has(c)) BYCODE.set(c, []);
  BYCODE.get(c).push(q);
}));

let curCode = null;   // 当前选中的考点代码，null = 显示全部（搜索/仅已选时用）

// ---- 考纲树 ----
function renderSyl() {
  const box = $("sylTree");
  box.innerHTML = "";
  SYL.forEach(chap => {
    const wrap = document.createElement("div");
    const head = document.createElement("div");
    head.className = "syl-chap open";
    const chapCount = countQuestionsIn(chap);
    head.innerHTML = `<span><b>${chap.code}</b> ${escapeHtml(chap.title)} <span class="selpill">${chapCount} 题</span></span>
      <span class="caret">▸</span>`;
    const sub = document.createElement("div");
    sub.className = "syl-sub";
    // 章节内所有叶子考点
    (collectTopics(chap)||[]).forEach(t => {
      const n = (BYCODE.get(t.code)||[]).length;
      const row = document.createElement("div");
      row.className = "syl-topic" + (curCode === t.code ? " on" : "");
      const html = `<span>${t.code} ${escapeHtml(t.title||"")}</span><span class="n">${n} 题</span>`;
      row.innerHTML = html;
      row.onclick = () => {
        $("sylTree").querySelectorAll(".syl-topic").forEach(x => x.classList.remove("on"));
        row.classList.add("on");
        curCode = t.code; setFilter("cur"); renderList();
      };
      sub.appendChild(row);
    });
    head.onclick = () => {
      head.classList.toggle("open");
      sub.style.display = sub.style.display === "none" ? "" : "none";
    };
    wrap.appendChild(head); wrap.appendChild(sub);
    box.appendChild(wrap);
  });
}
function countQuestionsIn(chap) {
  let n = 0;
  (collectTopics(chap)||[]).forEach(t => n += (BYCODE.get(t.code)||[]).length);
  return n;
}
function collectTopics(chap) {
  const out = [];
  (chap.children||[]).forEach(child => {
    (child.children||[]).forEach(leaf => { if (leaf && leaf.code && leaf.code.includes(".")) out.push(leaf); });
  });
  return out;
}

// ---- 题目列表 ----
function currentList() {
  const mode = document.querySelector("#filters button.on").dataset.f;
  if (mode === "all") return ALL;
  if (mode === "cur") return curCode ? (BYCODE.get(curCode)||[]) : ALL;
  if (mode === "my") return ALL.filter(q => selected.has(q.id));
  return ALL;
}
function renderList() {
  const q = $("qsearch").value.trim().toLowerCase();
  let list = currentList();
  if (q) {
    list = list.filter(item => {
      const hay = (item.topics||[]).join(" ") + " " + (item.codes||[]).join(" ") + " " + (item.body||"");
      return hay.toLowerCase().includes(q);
    });
  }
  // 标题
  const mode = document.querySelector("#filters button.on").dataset.f;
  let ttl;
  if (mode === "cur" && curCode) {
    ttl = `当前考点：${curCode}`;
  } else if (mode === "all") ttl = "全部题目";
  else if (mode === "my") ttl = "已选题目";
  else ttl = "题目";
  $("topicTitle").textContent = ttl;

  const box = $("qlist");
  box.innerHTML = "";
  $("qempty").style.display = list.length ? "none" : "block";
  list.slice(0, 200).forEach(qItem => box.appendChild(renderOne(qItem)));
  $("selCount").textContent = "已选 " + selected.size + " 题";
}

function renderOne(q) {
  const item = document.createElement("div");
  item.className = "qitem";
  const cb = document.createElement("input");
  cb.type = "checkbox"; cb.checked = selected.has(q.id);
  cb.onchange = () => {
    if (cb.checked) selected.add(q.id); else selected.delete(q.id);
    renderList(); refreshTreeSide();
  };
  const img = document.createElement("img");
  img.className = "thumb"; img.src = q.figures && q.figures[0] ? q.figures[0] : "";
  img.loading = "lazy";
  const info = document.createElement("div");
  info.className = "info";
  const b = document.createElement("b");
  b.textContent = `${q.year||"?"} ${q.session||""} P${q.paper} · Q${q.question} ${q.marks?"(" + q.marks + "分)":""} · 答案 ${q.ms_answer||"–"}`;
  info.appendChild(b);
  const sub = document.createElement("div");
  sub.className = "sub";
  sub.textContent = (q.topics||[]).join(" / ") || q.body?.slice(0,50) || q.id;
  info.appendChild(sub);
  item.appendChild(cb); item.appendChild(img); item.appendChild(info);
  return item;
}
function refreshTreeSide() {
  // 更新考纲树里每个考点的已选数标记
  $("sylTree").querySelectorAll(".syl-topic").forEach(row => {
    const code = row.querySelector("span").textContent.trim().split(" ")[0];
    const selCount = (BYCODE.get(code)||[]).filter(q => selected.has(q.id)).length;
    const total = (BYCODE.get(code)||[]).length;
    const n = row.querySelector(".n");
    n.textContent = selCount ? `${selCount}/${total} 题` : `${total} 题`;
  });
}

function setFilter(mode) {
  document.querySelectorAll("#filters button").forEach(x => x.classList.toggle("on", x.dataset.f === mode));
}

document.querySelectorAll("#filters button").forEach(b => {
  b.onclick = () => { document.querySelectorAll("#filters button").forEach(x=>x.classList.remove("on")); b.classList.add("on"); renderList(); };
});
$("qsearch").addEventListener("input", () => renderList());

$("createBtn").onclick = async () => {
  const title = $("title").value.trim();
  const idArr = [...selected];
  const msg = $("createMsg");
  if (!title) { msg.className="msg err"; msg.textContent="请输入作业标题"; return; }
  if (!idArr.length) { msg.className="msg err"; msg.textContent="请选择题目（在考纲树点一个考点，再勾选题目）"; return; }
  if (!window.HomeworkDB || !window.HomeworkDB.ready()) {
    msg.className="msg err"; msg.textContent="Supabase 未配置：请先填 config.js 再刷新。";
    return;
  }
  try {
    const dueAt = $("due").value ? new Date($("due").value).toISOString() : null;
    const ass = await window.HomeworkDB.createAssignment(title, idArr, dueAt);
    const link = location.origin + location.pathname.replace("assign.html","") + "homework.html?id=" + ass.id;
    $("linkBox").textContent = link;
    $("linkCard").style.display = "block";
    msg.className = "msg ok"; msg.textContent = "作业已创建！ID=" + ass.id;
  } catch (e) {
    msg.className = "msg err"; msg.textContent = "创建失败：" + e.message;
  }
};

function copyLink() {
  const t = $("linkBox").textContent;
  navigator.clipboard.writeText(t).then(() => {
    const b = $("createMsg"); b.className="msg ok"; b.textContent="链接已复制！发给学生即可。";
  });
}
function escapeHtml(s) {
  const d = document.createElement("div"); d.textContent = s==null?"":String(s); return d.innerHTML;
}

renderSyl();
renderList();
refreshTreeSide();
</script>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
</body>
</html>
