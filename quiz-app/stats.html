<!DOCTYPE html>
<html lang="zh-CN" data-course="teacher">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>作业统计 · ChemBank</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="theme.css" />
<style>
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; }
  a { color:var(--accent); }
  header { background:var(--bg-soft); border-bottom:1px solid var(--line); padding:14px 22px; display:flex; align-items:center; gap:16px; }
  header h1 { font-size:17px; margin:0; }
  header .nav a { margin-right:18px; font-size:14px; color:var(--muted); text-decoration:none; }
  header .nav a.on { color:#fff; font-weight:600; }
  .wrap { max-width:1000px; margin:0 auto; padding:22px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:18px; }
  .card h2 { font-size:15px; margin:0 0 12px; }
  .pick { display:flex; gap:8px; flex-wrap:wrap; }
  .pill { background:var(--panel-2); border:1px solid var(--line); padding:6px 12px; border-radius:20px; font-size:13px; cursor:pointer; color:var(--muted); }
  .pill.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .hwpick { position:relative; max-width:420px; }
  .hwpick-btn { width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px; text-align:left; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px; color:var(--text); font-family:inherit; font-size:15px; cursor:pointer; }
  .hwpick-btn .chev { color:var(--muted); font-size:13px; }
  .hwpick.open .hwpick-btn { border-color:var(--accent); }
  .hwpick-menu { display:none; position:absolute; left:0; right:0; top:calc(100% + 6px); z-index:20; background:var(--panel); border:1px solid var(--line); border-radius:12px; max-height:320px; overflow:auto; }
  .hwpick.open .hwpick-menu { display:block; }
  .hwpick-opt { display:block; width:100%; text-align:left; background:transparent; border:none; color:var(--text); font-family:inherit; font-size:14px; padding:11px 14px; cursor:pointer; }
  .hwpick-opt:hover, .hwpick-opt.on { background:var(--accent-soft); color:var(--accent-deep); }
  .hwpick-opt .meta { color:var(--muted); font-size:12px; margin-top:2px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:600; font-size:12px; }
  .bar { height:8px; background:var(--panel-2); border-radius:5px; overflow:hidden; min-width:80px; }
  .bar i { display:block; height:100%; }
  .green { color:var(--green); } .red { color:var(--red); } .amber{color:var(--amber);}
  .sum-cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px; margin-bottom:18px; }
  .sum { background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:15px; text-align:center; }
  .sum .v { font-size:22px; font-weight:800; color:var(--accent); }
  .sum .k { font-size:12px; color:var(--muted); margin-top:3px; }
  .empty { color:var(--muted); padding:30px; text-align:center; }
  .err { color:var(--red); font-size:13px; }
  .btn { background:var(--panel-2); border:1px solid var(--line); color:var(--text); border-radius:9px; padding:8px 14px; cursor:pointer; font-size:13px; }
  .tag { display:inline-block; background:var(--panel-2); border-radius:6px; padding:1px 7px; font-size:11px; margin:2px; color:var(--muted); }
  .topic-row { display:flex; justify-content:space-between; align-items:center; padding:7px 4px; border-bottom:1px solid var(--line); font-size:13px; }
  .muted { color:var(--muted); }
  .small-note { color:var(--muted); font-size:12px; margin:-6px 0 12px; }
  /* 学生钻取表 */
  tr.stu-main { cursor:pointer; border-bottom:none; }
  tr.stu-main:focus { outline:1px solid var(--accent); outline-offset:-1px; }
  tr.stu-main:hover { background:var(--accent-soft); }
  tr.stu-main .caret { display:inline-block; width:12px; color:var(--muted); font-size:10px; transition:transform .15s; }
  tr.stu-main.open .caret { transform:rotate(90deg); color:var(--accent); }
  tr.stu-detail { display:none; background:var(--bg-soft); }
  tr.stu-detail.open { display:table-row; }
  tr.stu-detail.open td { padding:12px 14px; }
  .each-list { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:8px; }
  .each-item { background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:6px 9px; font-size:12px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .each-q { color:var(--muted); }
  .sort-btn { cursor:pointer; user-select:none; }
  .sort-btn:hover { color:var(--text); }
  /* 教师口令门 */
  .gate { max-width:420px; margin:80px auto; padding:0 20px; }
  .gate .card { padding:26px; }
  .gate h2 { margin-top:0; }
  .gate .input { width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--text); border-radius:10px; padding:12px 14px; font-size:15px; }
  .gate .input:focus { outline:none; border-color:var(--accent); }
  .gate .err { color:var(--red); font-size:13px; min-height:20px; }
</style>
</head>
<body>
<header>
  <h1>📊 作业统计</h1>
  <div class="nav">
    <a href="stats.html" class="on">查看统计</a>
    <a href="index.html">刷题库</a>
    <a href="home.html">学生首页</a>
    <a href="assign.html">布置作业</a>
  </div>
</header>

<!-- 教师口令登录门：口令正确前不加载/也不查询任何统计 -->
<div class="gate" id="loginGate">
  <div class="card" style="text-align:left">
    <h2>🔒 教师口令</h2>
    <p class="small-note" style="margin:0 0 4px">请输入教师口令以查看统计数据。</p>
    <input class="input" id="tokenInput" type="password" placeholder="教师口令" style="margin-top:6px" />
    <div class="err" id="gateErr"></div>
    <button class="btn" id="gateBtn" style="margin-top:4px;width:100%">进入统计</button>
  </div>
</div>

<div class="wrap" id="mainWrap" style="display:none">
  <div class="card">
    <h2>选择作业</h2>
    <div class="pick" id="trackFilter" style="margin-bottom:10px">
      <span class="pill on" data-track="">全部</span>
      <span class="pill" data-track="as">AS 9701</span>
      <span class="pill" data-track="ig">IGCSE 0620</span>
    </div>
    <div class="hwpick" id="hwPick">
      <button type="button" class="hwpick-btn" id="hwPickBtn"><span class="lab">选择作业…</span><span class="chev">▼</span></button>
      <div class="hwpick-menu" id="pickList"><span class="empty" style="padding:0">加载中…</span></div>
    </div>
    <p class="small-note" id="testerOpen" style="display:none;margin:12px 0 0"></p>
  </div>

  <div class="card err" id="statsErr" style="display:none"></div>

  <div id="overview" style="display:none">
    <div class="sum-cards" id="sumCards"></div>
    <div class="card">
      <h2>学生作答情况（按正确率排序，点击行展开每题对错）</h2>
      <div class="small-note">点击某学生行可展开，查看该生在每道题的作答对错。</div>
      <table><thead><tr><th>姓名</th><th>学号</th><th>得分</th><th class="sort-btn" id="stuAccTh" title="点击切换排序">正确率 <span id="stuAccArrow">▾</span></th><th>提交时间</th></tr></thead>
      <tbody id="stuRows"></tbody></table>
      <div class="empty" id="stuEmpty" style="display:none">还没有学生作答</div>
    </div>
    <div class="card">
      <h2>讲义题目分析（每题正确率，错得多的题建议重点讲）</h2>
      <div class="small-note">按正确率从低到高排序，最常做错的题在最上方。</div>
      <table><thead><tr><th>题目</th><th>答对人数</th><th>答错人数</th><th>正确率</th><th>标准答案</th><th>考点</th></tr></thead>
      <tbody id="qRows"></tbody></table>
      <div class="empty" id="qEmpty" style="display:none">暂无数据</div>
    </div>
    <div class="card">
      <h2>错题知识点分布（哪些考点大家最容易错）</h2>
      <div id="topicDist"></div>
      <div class="empty" id="tEmpty" style="display:none">暂无数据</div>
    </div>
  </div>
</div>

<script src="data.js?v=20260906z"></script>
<script src="structured-data.js?v=20260906z"></script>
<script src="roster.js?v=20260906z"></script>
<script src="config.js?v=20260906c"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js?v=20260906z"></script>
<script>
"use strict";
const ALL = (window.CHEMBANK_DATA && window.CHEMBANK_DATA.questions) || [];
const STRUCTURED = (window.STRUCTURED_DATA && window.STRUCTURED_DATA.questions) || [];
const BYID = new Map(ALL.map(q => [q.id, q]));
STRUCTURED.forEach(q => BYID.set(q.id, q));
const DB = window.HomeworkDB;

let assignments = [];
let trackFilter = "";
async function loadAssignments() {
  try {
    assignments = await DB.listAssignments();
    renderPickList();
  } catch (e) {
    document.getElementById("pickList").innerHTML = '<span class="err">加载失败：' + e.message + '</span>';
  }
}
function renderPickList() {
  const pl = document.getElementById("pickList");
  const btn = document.getElementById("hwPickBtn").querySelector(".lab");
  pl.innerHTML = "";
  const shown = assignments.filter((a) => {
    if (!trackFilter) return true;
    return window.ChemBankPortal.trackOf(a) === trackFilter;
  }).slice().sort((a, b) => window.ChemBankPortal.shortCode(a).localeCompare(window.ChemBankPortal.shortCode(b), "en", { numeric: true }));
  if (!shown.length) {
    pl.innerHTML = '<span class="empty">这一边还没有作业。</span>';
    btn.textContent = "选择作业…";
    return;
  }
  shown.forEach((a) => {
    const p = document.createElement("button");
    p.type = "button";
    p.className = "hwpick-opt" + (currentAss && currentAss.id === a.id ? " on" : "");
    const code = window.ChemBankPortal.shortCode(a);
    const n = (a.question_ids || []).length;
    p.innerHTML = "<b></b><div class=\"meta\"></div>";
    p.querySelector("b").textContent = code;
    p.querySelector(".meta").textContent = (a.title || "") + (n ? " · " + n + "题" : "");
    p.onclick = () => {
      document.getElementById("hwPick").classList.remove("open");
      selectAssignment(a.id, p);
    };
    pl.appendChild(p);
  });
  if (currentAss && shown.some((a) => a.id === currentAss.id)) {
    btn.textContent = window.ChemBankPortal.shortCode(currentAss);
  } else {
    btn.textContent = "选择作业…";
  }
}
document.getElementById("hwPickBtn").onclick = (e) => {
  e.stopPropagation();
  document.getElementById("hwPick").classList.toggle("open");
};
document.addEventListener("click", () => document.getElementById("hwPick").classList.remove("open"));
document.getElementById("hwPick").addEventListener("click", (e) => e.stopPropagation());
document.getElementById("trackFilter").onclick = (e) => {
  const pill = e.target.closest(".pill");
  if (!pill) return;
  trackFilter = pill.getAttribute("data-track") || "";
  document.querySelectorAll("#trackFilter .pill").forEach((x) => x.classList.toggle("on", x === pill));
  renderPickList();
};

let currentAss = null;
async function selectAssignment(id, pillEl) {
  const ass = assignments.find(a => a.id === id);
  if (!ass) return;
  currentAss = ass;
  document.getElementById("hwPickBtn").querySelector(".lab").textContent = window.ChemBankPortal.shortCode(ass);
  renderPickList();
  const qs = (ass.question_ids||[]).map(qid => BYID.get(qid)).filter(Boolean);
  try {
    // 安全收紧后：anon 已不能直接 select students/answers，
    // 统一走带密钥校验的 Edge Function（readTeacherStats）。
    const pack = await DB.readTeacherStats(id, getToken());
    const rows = (pack && pack.rows) ? pack.rows : (Array.isArray(pack) ? pack : []);
    const submissions = (pack && pack.submissions) ? pack.submissions : [];
    const snap = (ass.question_snapshot || []).length ? ass.question_snapshot : qs;
    const bySnap = new Map((snap || []).map((q) => [q.id, q]));
    const merged = (ass.question_ids || []).map((qid) => Object.assign({}, bySnap.get(qid) || {}, BYID.get(qid) || {}, { id: qid }));
    hideStatsErr();
    renderOverview(ass, merged.length ? merged : snap, rows, submissions);
  } catch (e) {
    showStatsErr("统计失败：" + (e && e.message ? e.message : e));
  }
}

let stuSort = { field:"acc", dir:-1 }; // 默认正确率降序
function stuKey(r){ return r.student_id ?? (r.students ? (r.students.student_no+"|"+r.students.name) : JSON.stringify(r.students)); }
function qLabel(q){ return `${q.year||""} ${q.session||""} P${q.paper} Q${q.question}`.replace(/\s+/g," ").trim() || (q.id||""); }

function showStatsErr(msg) {
  const el = document.getElementById("statsErr");
  if (!el) return;
  el.style.display = "block";
  el.textContent = msg;
  const ov = document.getElementById("overview");
  if (ov) ov.style.display = "none";
}
function hideStatsErr() {
  const el = document.getElementById("statsErr");
  if (el) { el.style.display = "none"; el.textContent = ""; }
}

function renderOverview(ass, qs, rows, submissions) {
  rows = rows || [];
  submissions = submissions || [];
  qs = qs || [];
  const sumCards = document.getElementById("sumCards");
  if (!sumCards) {
    showStatsErr("统计页需要刷新后才能查看（请 Cmd+R 刷新本页）。");
    return;
  }
  document.getElementById("overview").style.display = "block";
  const testerOpen = document.getElementById("testerOpen");
  if (testerOpen) {
    const track = window.ChemBankPortal.trackOf(ass);
    testerOpen.style.display = "block";
    testerOpen.innerHTML = "";
    const a = document.createElement("a");
    a.href = "homework.html?id=" + encodeURIComponent(ass.id) + "&track=" + encodeURIComponent(track);
    a.target = "_blank";
    a.rel = "noopener";
    a.textContent = "用 Tester 打开学生页";
    testerOpen.appendChild(a);
    testerOpen.appendChild(document.createTextNode(" · 选 Tester 后输入教师口令"));
  }

  const totalStudents = new Set(submissions.map(s => s.student_id).concat(rows.map(stuKey))).size;
  const graded = rows.filter(r => r.correct === true || r.correct === false);
  const correctCount = rows.filter(r => r.correct === true).length;
  const avgAcc = submissions && submissions.length
    ? Math.round(submissions.reduce((a,s)=>a+Number(s.accuracy||0),0) / submissions.length)
    : (graded.length ? Math.round(correctCount/graded.length*100) : null);
  const avgScore = submissions && submissions.length
    ? (submissions.reduce((a,s)=>a+Number(s.score||0),0) / submissions.length)
    : null;

  document.getElementById("sumCards").innerHTML = "";
  const mk = (v,k)=>{const d=document.createElement("div");d.className="sum";d.innerHTML=`<div class="v">${v}</div><div class="k">${k}</div>`;return d;};
  const sc = document.getElementById("sumCards");
  sc.appendChild(mk(submissions.length || new Set(rows.map(stuKey)).size, "已提交学生"));
  sc.appendChild(mk(avgScore==null ? "–" : (Math.round(avgScore*10)/10), "平均得分"));
  sc.appendChild(mk(avgAcc==null ? "–" : avgAcc+"%", "平均正确率"));

  renderStudentTable(rows, qs, submissions || []);
  renderHandoutTable(rows, qs, submissions.length || new Set(rows.map(stuKey)).size);

  // 错题知识点分布
  const tEmpty = document.getElementById("tEmpty");
  const wrongRows = rows.filter(r => r.correct === false);
  const topicCnt = new Map();
  wrongRows.forEach(r => {
    const q = BYID.get(r.question_id);
    (q?.topics||[]).forEach(t => topicCnt.set(t, (topicCnt.get(t)||0)+1));
  });
  const td = document.getElementById("topicDist");
  td.innerHTML = "";
  tEmpty.style.display = topicCnt.size ? "none" : "block";
  [...topicCnt.entries()].sort((a,b)=>b[1]-a[1]).slice(0,15).forEach(([t,c]) => {
    const d = document.createElement("div");
    d.className = "topic-row";
    d.innerHTML = `<span>${esc(t)}</span><b class="red">${c} 次做错</b>`;
    td.appendChild(d);
  });
}

// 学生作答情况：一行一名学生，按正确率排序；点击展开每题对错
function renderStudentTable(rows, qs, submissions) {
  const subByStu = new Map((submissions || []).map(s => [s.student_id, s]));
  const byStu = new Map();
  const ansMapByStu = new Map();
  rows.forEach(r => {
    const k = r.student_id ?? stuKey(r);
    if(!byStu.has(k)) byStu.set(k, { stu:r.students, student_id:r.student_id, n:0, ok:0, acc:0 });
    const s = byStu.get(k);
    s.n++; if(r.correct) s.ok++;
    if(!ansMapByStu.has(k)) ansMapByStu.set(k, new Map());
    ansMapByStu.get(k).set(r.question_id, r);
  });
  const list = [...byStu.entries()].map(([key, s]) => {
    const sub = subByStu.get(s.student_id);
    return {
      ...s, key,
      acc: sub ? Number(sub.accuracy||0)/100 : (s.n? s.ok/s.n : 0),
      score: sub ? `${sub.score} / ${sub.total_score}` : `${s.ok}/${s.n}`,
      submittedAt: sub && sub.submitted_at ? new Date(sub.submitted_at).toLocaleString() : "–",
    };
  });
  list.sort((a,b) => stuSort.dir * (a.acc - b.acc));

  const st = document.getElementById("stuRows"); st.innerHTML = "";
  document.getElementById("stuEmpty").style.display = list.length ? "none" : "block";
  document.getElementById("stuAccArrow").textContent = stuSort.dir < 0 ? "▾" : "▴";
  document.getElementById("stuAccTh").onclick = () => { stuSort.dir *= -1; renderStudentTable(rows, qs, submissions); };

  list.forEach(({stu, acc, key, score, submittedAt}) => {
    const accPct = Math.round(acc*100);
    const color = accPct>=80?"green":accPct>=50?"amber":"red";
    const main = document.createElement("tr");
    main.className = "stu-main";
    main.setAttribute("tabindex","0");
    main.setAttribute("aria-expanded","false");
    main.innerHTML = `<td><span class="caret">▶</span> ${esc(stu?.name||"?")}</td>
      <td>${esc(stu?.student_no||"–")}</td>
      <td>${esc(score)}</td>
      <td><div style="display:flex;align-items:center;gap:8px">
        <div class="bar"><i style="width:${accPct}%;background:var(--${color});height:100%;border-radius:5px"></i></div>
        <b class="${color}">${accPct}%</b></div></td>
      <td class="muted">${esc(submittedAt)}</td>`;

    const det = document.createElement("tr");
    det.className = "stu-detail";
    const ansMap = ansMapByStu.get(key) || new Map();
    const items = qs.map(q => {
      const a = ansMap.get(q.id);
      const qObj = BYID.get(q.id) || q;
      let cls = "muted", icon = "–";
      if (a && a.correct === true) { cls = "green"; icon = "✓ 对"; }
      else if (a && a.correct === false) { cls = "red"; icon = "✗ 错"; }
      else if (a) { cls = "amber"; icon = "待评"; }
      const stuAns = a ? (a.chosen || "–") : "–";
      const keyAns = qObj.ms_answer || (a && a.correct == null ? "结构题" : "–");
      return `<div class="each-item" style="flex-direction:column;align-items:flex-start">
        <span class="each-q">${esc(qLabel(qObj))}</span>
        <span>学生：<b>${esc(stuAns)}</b> · 标准：<b>${esc(keyAns)}</b> · <b class="${cls}">${icon}</b></span>
      </div>`;
    }).join("");
    det.innerHTML = `<td colspan="5"><div class="each-list">${items}</div></td>`;

    const toggle = () => {
      const opening = !main.classList.contains("open");
      main.classList.toggle("open", opening);
      det.classList.toggle("open", opening);
      main.setAttribute("aria-expanded", String(opening));
    };
    main.onclick = toggle;
    main.onkeydown = (e)=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); toggle(); } };

    st.appendChild(main);
    st.appendChild(det);
  });
}

// 讲义题目分析：每道题 正确率/答卷数/标准答案/考点，错得多的在前
function renderHandoutTable(rows, qs, totalStudents) {
  const qt = document.getElementById("qRows"); qt.innerHTML = "";
  const qEmpty = document.getElementById("qEmpty");
  const perQ = qs.map(q => {
    const hits = rows.filter(r => r.question_id === q.id);
    const ok = hits.filter(h => h.correct === true).length;
    const wrong = hits.filter(h => h.correct === false).length;
    return { q, answered:hits.length, ok, wrong };
  });
  perQ.sort((a,b) => {
    const aa = a.answered ? a.ok/a.answered : 1; // 无人作答视为满分，排在最后
    const bb = b.answered ? b.ok/b.answered : 1;
    if(aa !== bb) return aa - bb;              // 正确率升序 → 最常做错的在前
    return qs.indexOf(a.q) - qs.indexOf(b.q);  // 相同时按作业顺序
  });
  qEmpty.style.display = perQ.length ? "none" : "block";

  perQ.forEach(({q, answered, ok, wrong}) => {
    const acc = answered ? Math.round(ok/answered*100) : null;
    const color = acc==null ? "" : (acc>=80?"green":acc>=50?"amber":"red");
    const isStructured = q.type === "structured";
    const ms = isStructured
      ? '<span class="muted">结构题 · 提交后看 MS</span>'
      : (q.ms_answer ? `<b class="green">${esc(q.ms_answer)}</b>` : '<span class="muted">–</span>');
    const accCell = acc==null
      ? '<span class="muted">–</span>'
      : `<div style="display:flex;align-items:center;gap:8px"><div class="bar"><i style="width:${acc}%;background:var(--${color});height:100%;border-radius:5px"></i></div><b class="${color}">${acc}%</b></div>`;
    const topic = (q.topics&&q.topics.length) ? q.topics.slice(0,2).map(esc).join("；") : '<span class="muted">–</span>';

    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${esc(qLabel(q))}</td>
      <td class="green">${ok}</td>
      <td class="red">${wrong}</td>
      <td>${accCell}</td>
      <td>${ms}</td>
      <td>${topic}</td>`;
    qt.appendChild(tr);
  });
}

function esc(s){ const d=document.createElement("div"); d.textContent=s==null?"":String(s); return d.innerHTML; }

// ============================================================
// 教师口令门
// ------------------------------------------------------------
// 🔒 安全模型：教师口令（TEACHER_TOKEN）只存在 Supabase secrets 里，
//    前端**不再保存、也不再本地比对**口令。老师输入后原样传给
//    stats-edge / assignment Edge Function，由后端校验（错口令→401）。
//    因此学生看源码拿不到口令，也无法伪造教师身份。
// ============================================================
let __token = null;

function getToken() { return __token; }

function setupGate() {
  const input = document.getElementById("tokenInput");
  const err = document.getElementById("gateErr");
  const btn = document.getElementById("gateBtn");

  const unlock = () => {
    const v = input.value.trim();
    if (!v) { err.textContent = "请输入教师口令"; input.focus(); return; }
    __token = v; // 真实校验在后端（读统计时 401 → 提示口令错误）
    // 记住口令（仅当次会话），刷新页面不用再输
    try { sessionStorage.setItem("stats-token", __token); } catch (e) {}
    document.getElementById("loginGate").style.display = "none";
    document.getElementById("mainWrap").style.display = "block";
    loadAssignments();
  };
  btn.onclick = unlock;
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); unlock(); } });

  // 本会话已通过 → 跳过登录，直接进入
  try {
    const cached = sessionStorage.getItem("stats-token");
    if (cached) { __token = cached; document.getElementById("loginGate").style.display = "none"; document.getElementById("mainWrap").style.display = "block"; loadAssignments(); return; }
  } catch (e) {}
  input.focus();
}

setupGate();
</script>
