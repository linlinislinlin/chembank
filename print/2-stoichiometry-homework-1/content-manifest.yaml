  marks: 1
  text: 'The diagram shows the apparatus used to find the relative molecular mass
    of a volatile liquid.


    When 0.10\,g of a volatile liquid is injected into the syringe, all of the volatile
    liquid evaporates and the volume increases by 85\,cm$^3$.


    The heater maintains a temperature of 400\,K and the experiment is carried out
    at a pressure of 101\,300\,Pa.

    \qfig[0.78]{fig-q03-apparatus.png}

    If the vapour of the volatile liquid behaves as an ideal gas, which expression
    can be used to calculate the relative molecular mass of the liquid?

    \optlist{$M_\mathrm{r}=(85\times 101\,300)\div(0.10\times 8.31\times 400)$}{$M_\mathrm{r}=(85\times
    101.3)\div(0.10\times 8.31\times 400)$}{$M_\mathrm{r}=(0.10\times 8.31\times 400)\div(85\times
    10^{-6}\times 101\,300)$}{$M_\mathrm{r}=(0.10\times 8.31\times 400)\div(85\times
    10^{-6}\times 101.3)$}'
