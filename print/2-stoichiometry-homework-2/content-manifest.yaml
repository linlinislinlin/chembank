    12.0\,g of malachite is added to 30.0\,cm$^3$ of 1.50\,mol\,dm$^{-3}$ nitric acid.


    Which mass of malachite is left unreacted when the reaction is complete?

    \optrow{2.05\,g}{2.49\,g}{7.03\,g}{9.51\,g}'
