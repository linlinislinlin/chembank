- id: Q01
  type: mcq
  source_loc: Q01
  keep: true
  render: latex
  duplicate_of: null
  reason: first occurrence
  marks: 1
  text: 'Calcium oxide and magnesium sulfide each react with acid.

    \begin{align*}

    \ce{CaO(s) + 2H+(aq) &-> Ca^{2+}(aq) + H2O(l)}\\

    \ce{MgS(s) + 2H+(aq) &-> Mg^{2+}(aq) + H2S(g)}

    \end{align*}

    A mixture of these two compounds, X, reacts with exactly 0.125\,mol of dilute
    hydrochloric acid.


    The amount of hydrogen sulfide formed is 0.0250\,mol.


    What was the mass of calcium oxide in mixture X?

    \optrow{1.4\,g}{2.1\,g}{2.8\,g}{4.2\,g}'
