    - id: '23.1-2a'
      text: define and use the term first electron affinity, EA
    - id: '23.1-2b'
      text: explain the factors affecting the electron affinities of elements
    - id: '23.1-2c'
      text: describe and explain the trends in the electron affinities of the Group 16 and Group 17 elements
    - id: '23.1-3'
      text: construct and use Born–Haber cycles for ionic solids (limited to +1 and +2 cations, –1 and
        –2 anions)
    - id: '23.1-4'
      text: carry out calculations involving Born–Haber cycles
    - id: '23.1-5'
      text: explain, in qualitative terms, the effect of ionic charge and of ionic radius on the numerical
        magnitude of a lattice energy
  - code: '23.2'
    title: Enthalpies of solution and hydration
    learning_outcomes:
    - id: '23.2-1'
      text: define and use the term enthalpy change with reference to hydration, ΔHhyd, and solution,
        ΔHsol
    - id: '23.2-2'
      text: construct and use an energy cycle involving enthalpy change of solution, lattice energy and
        enthalpy change of hydration
    - id: '23.2-3'
      text: carry out calculations involving the energy cycles in 23.2.2
    - id: '23.2-4'
      text: explain, in qualitative terms, the effect of ionic charge and of ionic radius on the numerical
        magnitude of an enthalpy change of hydration
  - code: '23.3'
    title: Entropy change, ΔS
    learning_outcomes:
    - id: '23.3-1'
      text: define the term entropy, S, as the number of possible arrangements of the particles and their
        energy in a given system
    - id: '23.3-2a'
      text: 'predict and explain the sign of the entropy changes that occur: (a) during a change in state,
        e.g. melting, boiling and dissolving (and their reverse)'
    - id: '23.3-2b'
      text: 'predict and explain the sign of the entropy changes that occur: (b) during a temperature
        change'
    - id: '23.3-2c'
      text: 'predict and explain the sign of the entropy changes that occur: (c) during a reaction in
        which there is a change in the number of gaseous molecules'
    - id: '23.3-3'
      text: calculate the entropy change for a reaction, ΔS, given the standard entropies, S products,
        ΔS ⦵ = ΣS (use of ΔS ⦵ = ΔSsurr + ΔSsys is not required)
  - code: '23.4'
    title: Gibbs free energy change, ΔG
    learning_outcomes:
    - id: '23.4-1'
      text: state and use the Gibbs equation ΔG
    - id: '23.4-2'
      text: perform calculations using the equation ΔG
    - id: '23.4-3'
      text: state whether a reaction or process will be feasible by using the sign of ΔG
    - id: '23.4-4'
      text: predict the effect of temperature change on the feasibility of a reaction, given standard
        enthalpy and entropy changes
- code: '24'
  title: Electrochemistry
  level: A
  group: Physical chemistry
  subtopics:
  - code: '24.1'
    title: Electrolysis
    learning_outcomes:
    - id: '24.1-1'
      text: predict the identities of substances liberated during electrolysis from the state of electrolyte
        (molten or aqueous), position in the redox series (electrode potential) and concentration
    - id: '24.1-2'
      text: state and apply the relationship F = Le between the Faraday constant, F, the Avogadro constant,
        L, and the charge on the electron, e
    - id: '24.1-3a'
      text: 'calculate: (a) the quantity of charge passed during electrolysis, using Q = It'
    - id: '24.1-3b'
      text: 'calculate: (b) the mass and/or volume of substance liberated during electrolysis'
    - id: '24.1-4'
      text: describe the determination of a value of the Avogadro constant by an electrolytic method
  - code: '24.2'
    title: Standard electrode potentials E⦵
    learning_outcomes:
    - id: '24.2-1a'
      text: 'define the terms: (a) standard electrode (reduction) potential'
    - id: '24.2-1b'
      text: 'define the terms: (b) standard cell potential'
    - id: '24.2-2'
      text: describe the standard hydrogen electrode
    - id: '24.2-3a'
      text: 'describe methods used to measure the standard electrode potentials of: (a) metals or non-metals
        in contact with their ions in aqueous solution'
    - id: '24.2-3b'
      text: 'describe methods used to measure the standard electrode potentials of: (b) ions of the same
        element in different oxidation states'
    - id: '24.2-4'
      text: calculate a standard cell potential by combining two standard electrode potentials
    - id: '24.2-5a'
      text: 'use standard cell potentials to: (a) deduce the polarity of each electrode and hence explain/deduce
        the direction of electron flow in the external circuit of a simple cell'
    - id: '24.2-5b'
      text: 'use standard cell potentials to: (b) predict the feasibility of a reaction'
    - id: '24.2-6'
      text: deduce from E ⦵ values the relative reactivity of elements, compounds and ions as oxidising
        agents or as reducing agents
    - id: '24.2-7'
      text: construct redox equations using the relevant half-equations
    - id: '24.2-8'
      text: predict qualitatively how the value of an electrode potential, E, varies with the concentrations
        of the aqueous ions
    - id: '24.2-9'
      text: use the Nernst equation, e.g. E = E to predict quantitatively how the value of an electrode
        potential varies with the concentrations of the aqueous ions; examples include Cu2+(aq) + 2e–⇌
        Cu(s), Fe3+(aq) + e– ⇌ Fe2+(aq)
    - id: '24.2-10'
      text: understand and use the equation ΔG
- code: '25'
  title: Equilibria
  level: A
  group: Physical chemistry
  subtopics:
  - code: '25.1'
    title: Acids and bases
    learning_outcomes:
    - id: '25.1-1'
      text: understand and use the terms conjugate acid and conjugate base
    - id: '25.1-2'
      text: define conjugate acid–base pairs, identifying such pairs in reactions
    - id: '25.1-3'
      text: define mathematically the terms pH, Ka, pKa and Kw and use them in calculations (Kb and the
        equation Kw = Ka × Kb will not be tested)
    - id: '25.1-4a'
      text: 'calculate [H+(aq)] and pH values for: (a) strong acids'
    - id: '25.1-4b'
      text: 'calculate [H+(aq)] and pH values for: (b) strong alkalis'
    - id: '25.1-4c'
      text: 'calculate [H+(aq)] and pH values for: (c) weak acids'
    - id: '25.1-5a'
      text: define a buffer solution
    - id: '25.1-5b'
      text: explain how a buffer solution can be made
    - id: '25.1-5c'
      text: explain how buffer solutions control pH; use chemical equations in these explanations
    - id: '25.1-5d'
      text: describe and explain the uses of buffer solutions, including the role of HCO3 blood
    - id: '25.1-6'
      text: calculate the pH of buffer solutions, given appropriate data
    - id: '25.1-7'
      text: understand and use the term solubility product, Ksp
    - id: '25.1-8'
      text: write an expression for Ksp
    - id: '25.1-9'
      text: calculate Ksp from concentrations and vice versa
    - id: '25.1-10a'
      text: understand and use the common ion effect to explain the different solubility of a compound
        in a solution containing a common ion
    - id: '25.1-10b'
      text: perform calculations using Ksp values and concentration of a common ion
  - code: '25.2'
    title: Partition coefficients
    learning_outcomes:
    - id: '25.2-1'
      text: state what is meant by the term partition coefficient, Kpc
    - id: '25.2-2'
      text: calculate and use a partition coefficient for a system in which the solute is in the same
        physical state in the two solvents
    - id: '25.2-3'
      text: understand the factors affecting the numerical value of a partition coefficient in terms of
        the polarities of the solute and the solvents used
- code: '26'
  title: Reaction kinetics
  level: A
  group: Physical chemistry
  subtopics:
  - code: '26.1'
    title: Simple rate equations, orders of reaction and rate constants
    learning_outcomes:
    - id: '26.1-1'
      text: explain and use the terms rate equation, order of reaction, overall order of reaction, rate
        constant, half-life, rate-determining step and intermediate
    - id: '26.1-2a'
      text: understand and use rate equations of the form rate = k [A]m[B]n (for which m and n are 0,
        1 or 2)
    - id: '26.1-2b'
      text: deduce the order of a reaction from concentration–time graphs or from experimental data relating
        to the initial rates method and half-life method
    - id: '26.1-2c'
      text: interpret experimental data in graphical form, including concentration–time and rate–concentration
        graphs
    - id: '26.1-2d'
      text: calculate an initial rate using concentration data
    - id: '26.1-2e'
      text: construct a rate equation
    - id: '26.1-3a'
      text: show understanding that the half-life of a first-order reaction is independent of concentration
    - id: '26.1-3b'
      text: use the half-life of a first-order reaction in calculations
    - id: '26.1-4a'
      text: 'calculate the numerical value of a rate constant, for example by: (a) using the initial rates
        and the rate equation'
    - id: '26.1-4b'
      text: 'calculate the numerical value of a rate constant, for example by: (b) using the half-life,
        t½ , and the equation k = 0.693 / t½'
    - id: '26.1-5a'
      text: 'for a multi-step reaction: (a) suggest a reaction mechanism that is consistent with the rate
        equation and the equation for the overall reaction'
    - id: '26.1-5b'
      text: 'for a multi-step reaction: (b) predict the order that would result from a given reaction
        mechanism and rate-determining step'
    - id: '26.1-5c'
      text: 'for a multi-step reaction: (c) deduce a rate equation using a given reaction mechanism and
        rate-determining step for a given reaction'
    - id: '26.1-5d'
      text: 'for a multi-step reaction: (d) identify an intermediate or catalyst from a given reaction
        mechanism'
    - id: '26.1-5e'
      text: 'for a multi-step reaction: (e) identify the rate determining step from a rate equation and
        a given reaction mechanism'
    - id: '26.1-6'
      text: describe qualitatively the effect of temperature change on the rate constant and hence the
        rate of a reaction
  - code: '26.2'
    title: Homogeneous and heterogeneous catalysts
    learning_outcomes:
    - id: '26.2-1'
      text: explain that catalysts can be homogeneous or heterogeneous
    - id: '26.2-2a'
      text: 'describe the mode of action of a heterogeneous catalyst to include adsorption of reactants,
        bond weakening and desorption of products, for example: (a) iron in the Haber process'
    - id: '26.2-2b'
      text: 'describe the mode of action of a heterogeneous catalyst to include adsorption of reactants,
        bond weakening and desorption of products, for example: (b) palladium, platinum and rhodium in
        the catalytic removal of oxides of nitrogen from the exhaust gases of car engines'
    - id: '26.2-3a'
      text: 'describe the mode of action of a homogeneous catalyst by being used in one step and reformed
        in a later step, for example: (a) atmospheric oxides of nitrogen in the oxidation of atmospheric
        sulfur dioxide'
    - id: '26.2-3b'
      text: 'describe the mode of action of a homogeneous catalyst by being used in one step and reformed
        in a later step, for example: (b) Fe2+ or Fe3+ in the I–/S2O8'
- code: '27'
  title: Group 2
  level: A
  group: Inorganic chemistry
  subtopics:
  - code: '27.1'
    title: Similarities and trends in the properties of the Group 2 metals, magnesium to barium, and their
      compounds
    learning_outcomes:
    - id: '27.1-1'
      text: describe and explain qualitatively the trend in the thermal stability of the nitrates and
        carbonates including the effect of ionic radius on the polarisation of the large anion
    - id: '27.1-2'
      text: describe and explain qualitatively the variation in solubility and of enthalpy change of solution,
        ΔH the hydroxides and sulfates in terms of relative magnitudes of the enthalpy change of hydration
        and the lattice energy
- code: '28'
  title: Chemistry of transition elements
  level: A
  group: Inorganic chemistry
  subtopics:
  - code: '28.1'
    title: General physical and chemical properties of the first row of transition elements, titanium
      to copper
    learning_outcomes:
    - id: '28.1-1'
      text: define a transition element as a d-block element which forms one or more stable ions with
        incomplete d orbitals
    - id: '28.1-2'
      text: sketch the shape of a 3dxy orbital and 3dz² orbital
    - id: '28.1-3a'
      text: 'understand that transition elements have the following properties: (a) they have variable
        oxidation states'
    - id: '28.1-3b'
      text: 'understand that transition elements have the following properties: (b) they behave as catalysts'
    - id: '28.1-3c'
      text: 'understand that transition elements have the following properties: (c) they form complex
        ions'
    - id: '28.1-3d'
      text: 'understand that transition elements have the following properties: (d) they form coloured
        compounds'
    - id: '28.1-4'
      text: explain why transition elements have variable oxidation states in terms of the similarity
        in energy of the 3d and the 4s sub-shells
    - id: '28.1-5'
      text: explain why transition elements behave as catalysts in terms of having more than one stable
        oxidation state, and vacant d orbitals that are energetically accessible and can form dative bonds
        with ligands
    - id: '28.1-6'
      text: explain why transition elements form complex ions in terms of vacant d orbitals that are energetically
        accessible
  - code: '28.2'
    title: General characteristic chemical properties of the first set of transition elements, titanium
      to copper
    learning_outcomes:
    - id: '28.2-1'
      text: describe and explain the reactions of transition elements with ligands to form complexes,
        including the complexes of copper(II) and cobalt(II) ions with water and ammonia molecules and
        hydroxide and chloride ions
    - id: '28.2-2'
      text: define the term ligand as a species that contains a lone pair of electrons that forms a dative
        covalent bond to a central metal atom / ion
    - id: '28.2-3a'
      text: 'understand and use the terms: (a) monodentate ligand including as examples H2O, NH3, Cl –
        and CN–'
    - id: '28.2-3b'
      text: 'understand and use the terms: (b) bidentate ligand including as examples 1,2-diaminoethane,
        en, H2NCH2CH2NH2 and the ethanedioate ion, C2O4'
    - id: '28.2-3c'
      text: 'understand and use the terms: (c) polydentate ligand including as an example EDTA4–'
    - id: '28.2-4'
      text: define the term complex as a molecule or ion formed by a central metal atom / ion surrounded
        by one or more ligands
    - id: '28.2-5'
      text: describe the geometry (shape and bond angles) of transition element complexes which are linear,
        square planar, tetrahedral or octahedral
    - id: '28.2-6a'
      text: state what is meant by coordination number
    - id: '28.2-6b'
      text: predict the formula and charge of a complex ion, given the metal ion, its charge or oxidation
        state, the ligand and its coordination number or geometry
    - id: '28.2-7'
      text: explain qualitatively that ligand exchange can occur, including the complexes of copper(II)
        ions and cobalt(II) ions with water and ammonia molecules and hydroxide and chloride ions
    - id: '28.2-8'
      text: predict, using E ⦵ values, the feasibility of redox reactions involving transition elements
        and their ions
    - id: '28.2-9a'
      text: 'describe the reactions of, and perform calculations involving: (a) MnO4 – / C2O4'
    - id: '28.2-9b'
      text: 'describe the reactions of, and perform calculations involving: (b) MnO4 – / Fe2+ in acid
        solution given suitable data'
    - id: '28.2-9c'
      text: 'describe the reactions of, and perform calculations involving: (c) Cu2+ / I– given suitable
        data'
    - id: '28.2-10'
      text: perform calculations involving other redox systems given suitable data
  - code: '28.3'
    title: Colour of complexes
    learning_outcomes:
    - id: '28.3-1'
      text: define and use the terms degenerate and non-degenerate d orbitals
    - id: '28.3-2a'
      text: 'describe the splitting of degenerate d orbitals into two non-degenerate sets of d orbitals
        of higher energy, and use of Δ E in: (a) octahedral complexes, two higher and three lower d orbitals'
    - id: '28.3-2b'
      text: 'describe the splitting of degenerate d orbitals into two non-degenerate sets of d orbitals
        of higher energy, and use of Δ E in: (b) tetrahedral complexes, three higher and two lower d orbitals'
    - id: '28.3-3'
      text: explain why transition elements form coloured compounds in terms of the frequency of light
        absorbed as an electron is promoted between two non-degenerate d orbitals
    - id: '28.3-4'
      text: describe, in qualitative terms, the effects of different ligands on Δ E, frequency of light
        absorbed, and hence the complementary colour that is observed
    - id: '28.3-5'
      text: use the complexes of copper(II) ions and cobalt(II) ions with water and ammonia molecules
        and hydroxide and chloride ions as examples of ligand exchange affecting the colour observed
  - code: '28.4'
    title: Stereoisomerism in transition element complexes
    learning_outcomes:
    - id: '28.4-1a'
      text: 'describe the types of stereoisomerism shown by complexes, including those associated with
        bidentate ligands: (a) geometrical (cis/trans) isomerism, e.g. square planar such as [Pt(NH₃)₂Cl
        ₂] and octahedral such as [Co(NH3)4(H2O)2]2+ and [Ni(H2NCH2CH2NH2)2(H2O)2]2+'
    - id: '28.4-1b'
      text: 'describe the types of stereoisomerism shown by complexes, including those associated with
        bidentate ligands: (b) optical isomerism, e.g. [Ni(H2NCH2CH2NH2)3]2+ and [Ni(H2NCH2CH2NH2)2(H2O)2]2+'
    - id: '28.4-2'
      text: deduce the overall polarity of complexes such as those described in 28.4.1(a) and 28.4.1(b)
  - code: '28.5'
    title: Stability constants, Kstab
    learning_outcomes:
    - id: '28.5-1'
      text: define the stability constant, Kstab, of a complex as the equilibrium constant for the formation
        of the complex ion in a solvent (from its constituent ions or molecules)
    - id: '28.5-2'
      text: write an expression for a Kstab of a complex ([H₂O] should not be included)
    - id: '28.5-3'
      text: use Kstab expressions to perform calculations
    - id: '28.5-4'
      text: describe and explain ligand exchanges in terms of Kstab values and understand that a large
        Kstab is due to the formation of a stable complex ion group functional group arene arene *n/a
        benzene
- code: '29'
  title: An introduction to A Level organic chemistry
  level: A
  group: Organic chemistry
  subtopics:
  - code: '29.1'
    title: Formulas, functional groups and the naming of organic compounds
    learning_outcomes:
    - id: '29.1-1'
      text: understand that the compounds in the table on page 47 contain a functional group which dictates
        their physical and chemical properties
    - id: '29.1-2'
      text: interpret and use the general, structural, displayed and skeletal formulas of the classes
        of compound stated in the table on page 47
    - id: '29.1-3'
      text: understand and use systematic nomenclature of simple aliphatic organic molecules (including
        cyclic compounds containing a single ring of up to six carbon atoms) with functional groups detailed
        in the table on page 47, up to six carbon atoms (six plus six for esters and amides, straight
        chains only for esters and nitriles)
    - id: '29.1-4'
      text: understand and use systematic nomenclature of simple aromatic molecules with one benzene ring
        and one or more simple substituents, for example 3-nitrobenzoic acid or 2,4,6-tribromophenol
  - code: '29.2'
    title: Characteristic organic reactions
    learning_outcomes:
    - id: '29.2-1a'
      text: 'understand and use the following terminology associated with types of organic mechanisms:
        (a) electrophilic substitution'
    - id: '29.2-1b'
      text: 'understand and use the following terminology associated with types of organic mechanisms:
        (b) addition–elimination'
  - code: '29.3'
    title: Shapes of aromatic organic molecules; σ and π bonds
    learning_outcomes:
    - id: '29.3-1'
      text: describe and explain the shape of benzene and other aromatic molecules, including sp² hybridisation,
        in terms of σ bonds and a delocalised π system
  - code: '29.4'
    title: 'Isomerism: optical'
    learning_outcomes:
    - id: '29.4-1'
      text: understand that enantiomers have identical physical and chemical properties apart from their
        ability to rotate plane polarised light and their potential biological activity
    - id: '29.4-2'
      text: understand and use the terms optically active and racemic mixture
    - id: '29.4-3'
      text: describe the effect on plane polarised light of the two optical isomers of a single substance
    - id: '29.4-4a'
      text: 'explain the relevance of chirality to the synthetic preparation of drug molecules including:
        (a) the potential different biological activity of the two enantiomers'
    - id: '29.4-4b'
      text: 'explain the relevance of chirality to the synthetic preparation of drug molecules including:
        (b) the need to separate a racemic mixture into two pure enantiomers'
    - id: '29.4-4c'
      text: 'explain the relevance of chirality to the synthetic preparation of drug molecules including:
        (c) the use of chiral catalysts to produce a single pure optical isomer (Candidates should appreciate
        that compounds can contain more than one chiral centre, but knowledge of meso compounds and nomenclature
        such as diastereoisomers is not required.)'
- code: '30'
  title: Hydrocarbons
  level: A
  group: Organic chemistry
  subtopics:
  - code: '30.1'
    title: Arenes
    learning_outcomes:
    - id: '30.1-1a'
      text: 'describe the chemistry of arenes as exemplified by the following reactions of benzene and
        methylbenzene: (a) substitution reactions with Cl ₂ and with Br₂ in the presence of a catalyst,
        Al Cl ₃ or Al Br₃, to form halogenoarenes (aryl halides)'
    - id: '30.1-1b'
      text: 'describe the chemistry of arenes as exemplified by the following reactions of benzene and
        methylbenzene: (b) nitration with a mixture of concentrated HNO₃ and concentrated H₂SO₄ at a temperature
        between 25 °C and 60 °C'
    - id: '30.1-1c'
      text: 'describe the chemistry of arenes as exemplified by the following reactions of benzene and
        methylbenzene: (c) Friedel–Crafts alkylation by CH₃Cl and Al Cl ₃ and heat'
    - id: '30.1-1d'
      text: 'describe the chemistry of arenes as exemplified by the following reactions of benzene and
        methylbenzene: (d) Friedel–Crafts acylation by CH₃COCl and Al Cl ₃ and heat'
    - id: '30.1-1e'
      text: 'describe the chemistry of arenes as exemplified by the following reactions of benzene and
        methylbenzene: (e) complete oxidation of the side-chain using hot alkaline KMnO₄ and then dilute
        acid to give a benzoic acid'
    - id: '30.1-1f'
      text: 'describe the chemistry of arenes as exemplified by the following reactions of benzene and
        methylbenzene: (f) hydrogenation of the benzene ring using H₂ and Pt/Ni catalyst and heat to form
        a cyclohexane ring'
    - id: '30.1-2a'
      text: 'describe the mechanism of electrophilic substitution in arenes: (a) as exemplified by the
        formation of nitrobenzene and bromobenzene'
    - id: '30.1-2b'
      text: 'describe the mechanism of electrophilic substitution in arenes: (b) with regards to the effect
        of delocalisation (aromatic stabilisation) of electrons in arenes to explain the predomination
        of substitution over addition'
    - id: '30.1-3'
      text: predict whether halogenation will occur in the side-chain or in the aromatic ring in arenes
        depending on reaction conditions
    - id: '30.1-4'
      text: describe that in the electrophilic substitution of arenes, different substituents direct to
        different ring positions (limited to the directing effects of –NH₂, –OH, –R, –NO₂, –COOH and –COR)
- code: '31'
  title: Halogen compounds
  level: A
  group: Organic chemistry
  subtopics:
  - code: '31.1'
    title: Halogen compounds
    learning_outcomes:
    - id: '31.1-1'
      text: 'recall the reactions by which halogenoarenes can be produced: substitution of an arene with
        Cl₂ or Br₂ in the presence of a catalyst, Al Cl₃ or Al Br₃ to form a halogenoarene, exemplified
        by benzene to form chlorobenzene and methylbenzene to form 2-chloromethylbenzene and 4-chloromethylbenzene'
    - id: '31.1-2'
      text: explain the difference in reactivity between a halogenoalkane and a halogenoarene as exemplified
        by chloroethane and chlorobenzene
- code: '32'
  title: Hydroxy compounds
  level: A
  group: Organic chemistry
  subtopics:
  - code: '32.1'
    title: Alcohols
    learning_outcomes:
    - id: '32.1-1'
      text: describe the reaction with acyl chlorides to form esters using ethyl ethanoate
  - code: '32.2'
    title: Phenol
    learning_outcomes:
    - id: '32.2-1a'
      text: 'recall the reactions (reagents and conditions) by which phenol can be produced: (a) reaction
        of phenylamine with HNO₂ or NaNO₂ and dilute acid below 10 °C to produce the diazonium salt; further
        warming of the diazonium salt with H₂O to give phenol'
    - id: '32.2-2a'
      text: 'recall the chemistry of phenol, as exemplified by the following reactions: (a) with bases,
        for example NaOH(aq) to produce sodium phenoxide'
    - id: '32.2-2b'
      text: 'recall the chemistry of phenol, as exemplified by the following reactions: (b) with Na(s)
        to produce sodium phenoxide and H2(g)'
    - id: '32.2-2c'
      text: 'recall the chemistry of phenol, as exemplified by the following reactions: (c) in NaOH(aq)
        with diazonium salts, to give azo compounds'
    - id: '32.2-2d'
      text: 'recall the chemistry of phenol, as exemplified by the following reactions: (d) nitration
        of the aromatic ring with dilute HNO₃(aq) at room temperature to give a mixture of 2-nitrophenol
        and 4-nitrophenol'
    - id: '32.2-2e'
      text: 'recall the chemistry of phenol, as exemplified by the following reactions: (e) bromination
        of the aromatic ring with Br₂(aq) to form 2,4,6-tribromophenol'
    - id: '32.2-3'
      text: explain the acidity of phenol
    - id: '32.2-4'
      text: describe and explain the relative acidities of water, phenol and ethanol
    - id: '32.2-5'
      text: explain why the reagents and conditions for the nitration and bromination of phenol are different
        from those for benzene
    - id: '32.2-6'
      text: recall that the hydroxyl group of a phenol directs to the 2-, 4- and 6-positions
    - id: '32.2-7'
      text: apply knowledge of the reactions of phenol to those of other phenolic compounds, e.g. naphthol
- code: '33'
  title: Carboxylic acids and derivatives
  level: A
  group: Organic chemistry
  subtopics:
  - code: '33.1'
    title: Carboxylic acids
    learning_outcomes:
    - id: '33.1-1a'
      text: 'recall the reaction by which benzoic acid can be produced: (a) reaction of an alkylbenzene
        with hot alkaline KMnO₄ and then dilute acid, exemplified by methylbenzene'
    - id: '33.1-2'
      text: describe the reaction of carboxylic acids with PCl ₃ and heat, PCl ₅ or SOCl ₂ to form acyl
        chlorides
    - id: '33.1-3a'
      text: 'recognise that some carboxylic acids can be further oxidised: (a) the oxidation of methanoic
        acid, HCOOH, with Fehling’s reagent or Tollens’ reagent or acidified KMnO₄ or acidified K₂Cr₂O₇
        to carbon dioxide and water'
    - id: '33.1-3b'
      text: 'recognise that some carboxylic acids can be further oxidised: (b) the oxidation of ethanedioic
        acid, HOOCCOOH, with warm acidified KMnO₄ to carbon dioxide'
    - id: '33.1-4'
      text: describe and explain the relative acidities of carboxylic acids, phenols and alcohols
    - id: '33.1-5'
      text: describe and explain the relative acidities of chlorine-substituted carboxylic acids
  - code: '33.2'
    title: Esters
    learning_outcomes:
    - id: '33.2-1a'
      text: 'recall the reaction by which esters can be produced: (a) reaction of alcohols with acyl chlorides
        using the formation of ethyl ethanoate and phenyl benzoate as examples'
  - code: '33.3'
    title: Acyl chlorides
    learning_outcomes:
    - id: '33.3-1a'
      text: 'recall the reactions (reagents and conditions) by which acyl chlorides can be produced: (a)
        reaction of carboxylic acids with PCl ₃ and heat, PCl ₅ or SOCl ₂'
    - id: '33.3-2a'
      text: 'describe the following reactions of acyl chlorides: (a) hydrolysis on addition of water at
        room temperature to give the carboxylic acid and HCl'
    - id: '33.3-2b'
      text: 'describe the following reactions of acyl chlorides: (b) reaction with an alcohol at room
        temperature to produce an ester and HCl'
    - id: '33.3-2c'
      text: 'describe the following reactions of acyl chlorides: (c) reaction with phenol at room temperature
        to produce an ester and HCl'
    - id: '33.3-2d'
      text: 'describe the following reactions of acyl chlorides: (d) reaction with ammonia at room temperature
        to produce an amide and HCl'
    - id: '33.3-2e'
      text: 'describe the following reactions of acyl chlorides: (e) reaction with a primary or secondary
        amine at room temperature to produce an amide and HCl'
    - id: '33.3-3'
      text: describe the addition–elimination mechanism of acyl chlorides in reactions in 33.3.2(a)–(e)
    - id: '33.3-4'
      text: explain the relative ease of hydrolysis of acyl chlorides, alkyl chlorides and halogenoarenes
        (aryl chlorides)
- code: '34'
  title: Nitrogen compounds
  level: A
  group: Organic chemistry
  subtopics:
  - code: '34.1'
    title: Primary and secondary amines
    learning_outcomes:
    - id: '34.1-1a'
      text: 'recall the reactions (reagents and conditions) by which primary and secondary amines are
        produced: (a) reaction of halogenoalkanes with NH₃ in ethanol heated under pressure'
    - id: '34.1-1b'
      text: 'recall the reactions (reagents and conditions) by which primary and secondary amines are
        produced: (b) reaction of halogenoalkanes with primary amines in ethanol, heated in a sealed tube
        / under pressure'
    - id: '34.1-1c'
      text: 'recall the reactions (reagents and conditions) by which primary and secondary amines are
        produced: (c) the reduction of amides with LiAl H₄'
    - id: '34.1-1d'
      text: 'recall the reactions (reagents and conditions) by which primary and secondary amines are
        produced: (d) the reduction of nitriles with LiAl H₄ or H₂ / Ni'
    - id: '34.1-2'
      text: describe the condensation reaction of ammonia or an amine with an acyl chloride at room temperature
        to give an amide
    - id: '34.1-3'
      text: describe and explain the basicity of aqueous solutions of amines
  - code: '34.2'
    title: Phenylamine and azo compounds
    learning_outcomes:
    - id: '34.2-1'
      text: describe the preparation of phenylamine via the nitration of benzene to form nitrobenzene
        followed by reduction with hot Sn/concentrated HCl followed by NaOH(aq)
    - id: '34.2-2a'
      text: 'describe: (a) the reaction of phenylamine with Br₂(aq) at room temperature'
    - id: '34.2-2b'
      text: 'describe: (b) the reaction of phenylamine with HNO₂ or NaNO₂ and dilute acid below 10 °C
        to produce the diazonium salt; further warming of the diazonium salt with H₂O to give phenol'
    - id: '34.2-3'
      text: describe and explain the relative basicities of aqueous ammonia, ethylamine and phenylamine
    - id: '34.2-4a'
      text: 'recall the following about azo compounds: (a) describe the coupling of benzenediazonium chloride
        with phenol in NaOH(aq) to form an azo compound'
    - id: '34.2-4b'
      text: 'recall the following about azo compounds: (b) identify the azo group'
    - id: '34.2-4c'
      text: 'recall the following about azo compounds: (c) state that azo compounds are often used as
        dyes'
    - id: '34.2-4d'
      text: 'recall the following about azo compounds: (d) that other azo dyes can be formed via a similar
        route'
  - code: '34.3'
    title: Amides
    learning_outcomes:
    - id: '34.3-1a'
      text: 'recall the reactions (reagents and conditions) by which amides are produced: (a) the reaction
        between ammonia and an acyl chloride at room temperature'
    - id: '34.3-1b'
      text: 'recall the reactions (reagents and conditions) by which amides are produced: (b) the reaction
        between a primary amine and an acyl chloride at room temperature'
    - id: '34.3-2a'
      text: 'describe the reactions of amides: (a) hydrolysis with aqueous alkali or aqueous acid'
    - id: '34.3-2b'
      text: 'describe the reactions of amides: (b) the reduction of the CO group in amides with LiAl H₄
        to form an amine'
    - id: '34.3-3'
      text: state and explain why amides are much weaker bases than amines
  - code: '34.4'
    title: Amino acids
    learning_outcomes:
    - id: '34.4-1'
      text: describe the acid / base properties of amino acids and the formation of zwitterions, to include
        the isoelectric point
    - id: '34.4-2'
      text: describe the formation of amide (peptide) bonds between amino acids to give di- and tripeptides
    - id: '34.4-3'
      text: interpret and predict the results of electrophoresis on mixtures of amino acids and dipeptides
        at varying pHs (the assembling of the apparatus will not be tested)
- code: '35'
  title: Polymerisation
  level: A
  group: Organic chemistry
  subtopics:
  - code: '35.1'
    title: Condensation polymerisation
    learning_outcomes:
    - id: '35.1-1a'
      text: 'describe the formation of polyesters: (a) the reaction between a diol and a dicarboxylic
        acid or dioyl chloride'
    - id: '35.1-1b'
      text: 'describe the formation of polyesters: (b) the reaction of a hydroxycarboxylic acid'
    - id: '35.1-2a'
      text: 'describe the formation of polyamides: (a) the reaction between a diamine and a dicarboxylic
        acid or dioyl chloride'
    - id: '35.1-2b'
      text: 'describe the formation of polyamides: (b) the reaction of an aminocarboxylic acid'
    - id: '35.1-2c'
      text: 'describe the formation of polyamides: (c) the reaction between amino acids'
    - id: '35.1-3'
      text: deduce the repeat unit of a condensation polymer obtained from a given monomer or pair of
        monomers
    - id: '35.1-4'
      text: identify the monomer(s) present in a given section of a condensation polymer molecule
  - code: '35.2'
    title: Predicting the type of polymerisation
    learning_outcomes:
    - id: '35.2-1'
      text: predict the type of polymerisation reaction for a given monomer or pair of monomers
    - id: '35.2-2'
      text: deduce the type of polymerisation reaction which produces a given section of a polymer molecule
  - code: '35.3'
    title: Degradable polymers
    learning_outcomes:
    - id: '35.3-1'
      text: recognise that poly(alkenes) are chemically inert and can therefore be difficult to biodegrade
    - id: '35.3-2'
      text: recognise that some polymers can be degraded by the action of light
    - id: '35.3-3'
      text: recognise that polyesters and polyamides are biodegradable by acidic and alkaline hydrolysis
- code: '36'
  title: Organic synthesis
  level: A
  group: Organic chemistry
  subtopics:
  - code: '36.1'
    title: Organic synthesis
    learning_outcomes:
    - id: '36.1-1a'
      text: 'for an organic molecule containing several functional groups: (a) identify organic functional
        groups using the reactions in the syllabus'
    - id: '36.1-1b'
      text: 'for an organic molecule containing several functional groups: (b) predict properties and
        reactions'
    - id: '36.1-2'
      text: devise multi-step synthetic routes for preparing organic molecules using the reactions in
        the syllabus
    - id: '36.1-3'
      text: analyse a given synthetic route in terms of type of reaction and reagents used for each step
        of it, and possible by-products
- code: '37'
  title: Analytical techniques
  level: A
  group: Analysis
  subtopics:
  - code: '37.1'
    title: Thin-layer chromatography
    learning_outcomes:
    - id: '37.1-1a'
      text: describe and understand the terms (a) stationary phase, for example aluminium oxide (on a
        solid support)
    - id: '37.1-1b'
      text: describe and understand the terms (b) mobile phase; a polar or non-polar solvent
    - id: '37.1-1c'
      text: describe and understand the terms (c) Rf value
    - id: '37.1-1d'
      text: describe and understand the terms (d) solvent front and baseline
    - id: '37.1-2'
      text: interpret Rf values
    - id: '37.1-3'
      text: explain the differences in Rf values in terms of interaction with the stationary phase and
        of relative solubility in the mobile phase
  - code: '37.2'
    title: Gas / liquid chromatography
    learning_outcomes:
    - id: '37.2-1a'
      text: describe and understand the terms (a) stationary phase; a high boiling point non-polar liquid
        (on a solid support)
    - id: '37.2-1b'
      text: describe and understand the terms (b) mobile phase; an unreactive gas
    - id: '37.2-1c'
      text: describe and understand the terms (c) retention time
    - id: '37.2-2'
      text: interpret gas / liquid chromatograms in terms of the percentage composition of a mixture
    - id: '37.2-3'
      text: explain retention times in terms of interaction with the stationary phase
  - code: '37.3'
    title: Carbon-13 NMR spectroscopy
    learning_outcomes:
    - id: '37.3-1a'
      text: 'analyse and interpret a carbon-13 NMR spectrum of a simple molecule to deduce: (a) the different
        environments of the carbon atoms present'
    - id: '37.3-1b'
      text: 'analyse and interpret a carbon-13 NMR spectrum of a simple molecule to deduce: (b) the possible
        structures for the molecule'
    - id: '37.3-2'
      text: predict or explain the number of peaks in a carbon-13 NMR spectrum for a given molecule
  - code: '37.4'
    title: Proton (1H) NMR spectroscopy
    learning_outcomes:
    - id: '37.4-1a'
      text: 'analyse and interpret a proton (1H) NMR spectrum of a simple molecule to deduce: (a) the
        different environments of proton present using chemical shift values'
    - id: '37.4-1b'
      text: 'analyse and interpret a proton (1H) NMR spectrum of a simple molecule to deduce: (b) the
        relative numbers of each type of proton present from relative peak areas'
    - id: '37.4-1c'
      text: 'analyse and interpret a proton (1H) NMR spectrum of a simple molecule to deduce: (c) the
        number of equivalent protons on the carbon atom adjacent to the one to which the given proton
        is attached from the splitting pattern, using the n + 1 rule (limited to singlet, doublet, triplet,
        quartet and multiplet)'
    - id: '37.4-1d'
      text: 'analyse and interpret a proton (1H) NMR spectrum of a simple molecule to deduce: (d) the
        possible structures for the molecule'
    - id: '37.4-2'
      text: predict the chemical shifts and splitting patterns of the protons in a given molecule
    - id: '37.4-3'
      text: describe the use of tetramethylsilane, TMS, as the standard for chemical shift measurements
    - id: '37.4-4'
      text: state the need for deuterated solvents, e.g. CDCl ₃, when obtaining a proton NMR spectrum
    - id: '37.4-5'
      text: describe the identification of O–H and N–H protons by proton exchange using D₂O
