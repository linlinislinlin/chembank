[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chembank"
version = "0.1.0"
description = "Syllabus-first CIE 9701 chemistry past-paper question bank tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pymupdf>=1.24.0",
  "PyYAML>=6.0.1",
]

[project.scripts]
chembank = "chembank.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
