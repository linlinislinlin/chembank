<script>
/**
 * 微信小程序的运行环境替代品。
 *
 * 网页版直接复用了 services/storageService.ts，它只调三个 wx 存储 API。
 * 这里用 localStorage 把它顶上，所以我们不用为了网页重写一遍存取逻辑
 * —— 两边的菜单、收藏、热量记录格式完全一致。
 */
(function () {
  var PREFIX = 'canteen.web.';
  window.wx = {
    getStorageSync: function (key) {
      try {
        var raw = localStorage.getItem(PREFIX + key);
        return raw === null ? '' : JSON.parse(raw);
      } catch (e) {
        return '';
      }
    },
    setStorageSync: function (key, value) {
      try {
        localStorage.setItem(PREFIX + key, JSON.stringify(value));
      } catch (e) {
        // 隐私模式 / 配额满：不影响使用，只是这次不持久化
        console.warn('[storage] 写入失败', key, e);
      }
    },
    removeStorageSync: function (key) {
      try {
        localStorage.removeItem(PREFIX + key);
      } catch (e) {}
    },
    showToast: function (opts) {
      if (window.__miniToast) window.__miniToast((opts && opts.title) || '');
    },
    vibrateShort: function () {
      try {
        if (navigator.vibrate) navigator.vibrate(10);
      } catch (e) {}
    }
    // 故意不提供 cloud：cloudService.isCloudAvailable() 会返回 false，
    // 于是走「本地 + 内置菜单」这条路径，不依赖任何后端。
  };
})();
</script>
